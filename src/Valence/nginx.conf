server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # Same origin for the API, as SKP Studio's: the path is passed through unchanged (/api/v1/...). Valence has no hubs.
    # BaseApi's address is a setting (env BASEAPI_URL, k8s/32-valence.yaml, 2026-10-18), written in at container start.
    location /api/ {
        proxy_pass ${BASEAPI_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
    }

    # The chat (2026-10-26, as SKP Studio's nginx.conf): Valence's own route to the model (OpenAI-compatible; Kimi K3 at
    # Moonshot). Its three settings are environment variables (k8s/32-valence.yaml), written into this file at container
    # start by the image's envsubst (see the Dockerfile): KIMI_BASE_URL, KIMI_MODEL_ID (/ai/config tells Valence, which
    # sends it) and KIMI_API_KEY, which nginx adds so it never reaches the browser; BaseApi is not involved. Any of them
    # empty: 503 ("The chat is not configured").
    location = /ai/config {
        limit_except GET { deny all; }
        default_type application/json;
        set $ai_key "${KIMI_API_KEY}";
        set $ai_base "${KIMI_BASE_URL}";
        set $ai_model "${KIMI_MODEL_ID}";
        if ($ai_key = "") { return 503 '{"error":"The chat is not configured"}'; }
        if ($ai_base = "") { return 503 '{"error":"The chat is not configured"}'; }
        if ($ai_model = "") { return 503 '{"error":"The chat is not configured"}'; }
        add_header Cache-Control "no-store";
        return 200 '{"model":"$ai_model"}';
    }

    # One path, POST only, bounded body; the upstream is resolved per request (NGINX_LOCAL_RESOLVERS).
    location = /ai/chat/completions {
        limit_except POST { deny all; }
        set $ai_key "${KIMI_API_KEY}";
        set $ai_base "${KIMI_BASE_URL}";
        set $ai_upstream "";
        set $ai_host "";
        default_type application/json;
        if ($ai_key = "") { return 503 '{"error":"The chat is not configured"}'; }
        if ($ai_base ~ "^(https?://([^/:?#]+)[^?#]*?)/*$") {
            set $ai_upstream "$1/chat/completions";
            set $ai_host $2;
        }
        if ($ai_upstream = "") { return 503 '{"error":"The chat is not configured"}'; }
        resolver ${NGINX_LOCAL_RESOLVERS} valid=60s ipv6=off;
        client_max_body_size 2m;
        proxy_pass $ai_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $ai_host;
        proxy_set_header Host $ai_host;
        proxy_set_header Authorization "Bearer $ai_key";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        # Valence streams the answer: passed on as it comes, so the read timeout is the longest silence
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed assets can be cached forever; index.html must not be, or a deploy is not picked up.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
