server {
    listen 8080;
    root /usr/share/nginx/html;

    # The bundle is ~1.9 MB of JS; text/html is always compressed.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # Same origin for the API: the path is passed through unchanged (/api/v1/...).
    location /api/ {
        proxy_pass http://baseapi-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
    }

    # The liveness hub (SignalR, 2026-10-10): a WebSocket, so the upgrade is passed on and an idle connection is kept
    # open (the hub pings every 15 s; the long read timeout only bounds a dead peer). Same path, unchanged.
    location /api/hubs/ {
        proxy_pass http://baseapi-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # AI drawing (2026-10-11): the studio's own route to the model (Kimi K3 at Moonshot, OpenAI-compatible). nginx adds the
    # key from the skp-ai Secret (env KIMI_API_KEY, written into this file at container start by the image's envsubst; see
    # the Dockerfile), so it never reaches the browser; BaseApi is not involved. One path, POST only, bounded body; no key
    # configured: 503. The upstream is resolved per request (NGINX_LOCAL_RESOLVERS), so a cluster without internet still
    # starts. The model id is not enforced here: the studio sends kimi-k3, and the key is the key.
    location = /ai/chat/completions {
        limit_except POST { deny all; }
        set $ai_key "${KIMI_API_KEY}";
        default_type application/json;
        if ($ai_key = "") { return 503 '{"error":"AI drawing is not configured"}'; }
        resolver ${NGINX_LOCAL_RESOLVERS} valid=60s ipv6=off;
        set $ai_upstream https://api.moonshot.ai/v1/chat/completions;
        client_max_body_size 2m;
        proxy_pass $ai_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name api.moonshot.ai;
        proxy_set_header Host api.moonshot.ai;
        proxy_set_header Authorization "Bearer $ai_key";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        # the studio streams the answer (2026-10-11): passed on as it comes, so the read timeout is the longest silence
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed assets can be cached forever; index.html must not be, or a deploy is not picked up.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
