server {
    listen 8080;
    root /usr/share/nginx/html;

    # The bundle is ~1.9 MB of JS; text/html is always compressed.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # Same origin for the API: the path is passed through unchanged (/api/v1/...).
    location /api/ {
        proxy_pass http://baseapi-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
    }

    # The liveness hub (SignalR, 2026-10-10): a WebSocket, so the upgrade is passed on and an idle connection is kept
    # open (the hub pings every 15 s; the long read timeout only bounds a dead peer). Same path, unchanged.
    location /api/hubs/ {
        proxy_pass http://baseapi-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed assets can be cached forever; index.html must not be, or a deploy is not picked up.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
