<?xml version="1.0" encoding="UTF-8"?>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Three steps in a line. A cron fires simple-stepA every thirty seconds; A hands to B, B hands to C, and C has no successor so the run ends there. All three run on the same processor, sample-proc-v9. No schema edges are enforced and no step declares a failure branch.">
  <style>
    :root {
    --ground: #EEF0EC;
    --sheet: #FAFBF8;
    --ink: #191D1A;
    --muted: #667069;
    --rule: #D0D6CE;
    --rule-soft: #E1E6DF;
    --ok: #0E6B5E;
    --ok-soft: rgba(14, 107, 94, 0.10);
    --fail: #A8481A;
    --fail-soft: rgba(168, 72, 26, 0.10);
    --sans: "IBM Plex Sans Condensed", "Helvetica Neue", Arial, sans-serif;
    --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
    .node-box { fill: var(--sheet); stroke: var(--rule); stroke-width: 1.4; }
    .node-box-fork { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.4; }
    .node-box-fail { fill: var(--fail-soft); stroke: var(--fail); stroke-width: 1.4; }
    .hop-disc { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.2; }
    .hop-num { fill: var(--ok); font-family: var(--sans); font-size: 11px; font-weight: 700; }
    .n-proc { fill: var(--ink); font-family: var(--sans); font-size: 11.5px; font-weight: 600; }
    .n-proc-ver { fill: var(--muted); font-size: 9px; font-weight: 500; }
    .n-step { fill: var(--muted); font-family: var(--mono); font-size: 8.5px; }
    .n-step-ver { fill: var(--muted); font-size: 7.5px; }
    .n-cfg { fill: var(--ok); font-family: var(--mono); font-size: 10.5px; }
    .n-cfg-fail { fill: var(--fail); font-family: var(--mono); font-size: 10.5px; }
    .edge-ok { stroke: var(--ok); stroke-width: 1.6; fill: none; }
    .mk-ok { fill: var(--ok); }
    .lbl-note { fill: var(--muted); font-family: var(--sans); font-size: 11.5px; }
    .lbl-out { fill: var(--ink); font-family: var(--mono); font-size: 11px; }
    .topic-pill { fill: none; stroke: var(--ink); stroke-width: 1.2; }
    .topic-txt { fill: var(--ink); font-family: var(--mono); font-size: 12px; }
    .legend-txt { fill: var(--muted); font-family: var(--sans); font-size: 12px; }
  </style>

        <defs>
          <marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon class="mk-ok" points="0,1 10,5 0,9"></polygon>
          </marker>
        </defs>

        <!-- the trigger: no inbound topic, a cron -->
        <rect class="topic-pill" x="40" y="20" width="190" height="32"></rect>
        <text class="topic-txt" x="135" y="41" text-anchor="middle">cron 10,40 * * * * *</text>
        <line class="edge-ok" x1="135" y1="52" x2="135" y2="114" marker-end="url(#ar-ok)"></line>
        <text class="lbl-note" x="245" y="41" text-anchor="start">every 30s - one run per tick</text>

        <g>
          <rect class="node-box" x="40" y="120" width="150" height="86"></rect>
          <circle class="hop-disc" cx="58" cy="138" r="12"></circle>
          <text class="hop-num" x="58" y="142" text-anchor="middle">1</text>
          <text class="n-proc" x="115" y="162" text-anchor="middle">sample-proc-v9<tspan class="n-proc-ver">_1.5.0</tspan></text>
          <text class="n-step" x="115" y="179" text-anchor="middle">simple-stepA<tspan class="n-step-ver">_1.0.0</tspan></text>
          <text class="n-cfg" x="115" y="195" text-anchor="middle">label Step_A</text>
        </g>
        <line class="edge-ok" x1="190" y1="163" x2="280" y2="163" marker-end="url(#ar-ok)"></line>

        <g>
          <rect class="node-box" x="280" y="120" width="150" height="86"></rect>
          <circle class="hop-disc" cx="298" cy="138" r="12"></circle>
          <text class="hop-num" x="298" y="142" text-anchor="middle">2</text>
          <text class="n-proc" x="355" y="162" text-anchor="middle">sample-proc-v9<tspan class="n-proc-ver">_1.5.0</tspan></text>
          <text class="n-step" x="355" y="179" text-anchor="middle">simple-stepB<tspan class="n-step-ver">_1.0.0</tspan></text>
          <text class="n-cfg" x="355" y="195" text-anchor="middle">label Step_B</text>
        </g>
        <line class="edge-ok" x1="430" y1="163" x2="520" y2="163" marker-end="url(#ar-ok)"></line>

        <g>
          <rect class="node-box" x="520" y="120" width="150" height="86"></rect>
          <circle class="hop-disc" cx="538" cy="138" r="12"></circle>
          <text class="hop-num" x="538" y="142" text-anchor="middle">3</text>
          <text class="n-proc" x="595" y="162" text-anchor="middle">sample-proc-v9<tspan class="n-proc-ver">_1.5.0</tspan></text>
          <text class="n-step" x="595" y="179" text-anchor="middle">simple-stepC<tspan class="n-step-ver">_1.0.0</tspan></text>
          <text class="n-cfg" x="595" y="195" text-anchor="middle">label Step_C</text>
        </g>
        <line class="edge-ok" x1="670" y1="163" x2="748" y2="163" marker-end="url(#ar-ok)"></line>
        <text class="lbl-note" x="756" y="159" text-anchor="start">no successor accepts it</text>
        <text class="lbl-note" x="756" y="175" text-anchor="start">the run ends here</text>

        <text class="lbl-out" x="40" y="236" text-anchor="start">3 outcomes per cycle, one per step, all Completed - measured over 40 cycles</text>
        <text class="legend-txt" x="40" y="258" text-anchor="start">entryCondition 4 - Always, on all three steps: a successor is dispatched whatever the predecessor reported</text>
        <text class="legend-txt" x="40" y="276" text-anchor="start">no schema edges enforced - the processor declares neither an input nor an output schema, so nothing is validated between hops</text>
</svg>
