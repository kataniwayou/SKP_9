<!--
  simple-abc - workflow schematic

  Captured live from http://localhost:18080/api/v1 on 2026-09-22.

  THE SAME CANVAS WIDTH AS filefetcher-archiveexpander-chain.html - 1580 - AND THAT IS THE RULE THAT
  MATTERS. Both diagrams render into the same full-width panel, so the scale a browser applies is
  panelWidth / viewBoxWidth. Give one a narrower viewBox and it is blown up more, and the identical
  10px label comes out visibly larger than its twin. The first draft of this file used 900 and did
  exactly that.

  THE HEIGHT IS FREE, precisely because the panel constrains width and not height. It is 330 rather
  than the chain's 520: this workflow has no failure row to fill the lower band, and matching the
  height would only add white space. Geometry is otherwise copied - boxes 150x86 at y=120 on a 192px
  pitch, hop discs, the legend's line-sample-then-text idiom.

  NO CRON IS DRAWN, and that is a consistency rule rather than an omission. The chain is fired by a
  cron too (5,35) and does not show it: what the chain draws at the top is the inbound TOPIC, and
  topic-pill means "a Kafka topic". simple-abc consumes no topic - its entry processor makes its own
  input - so there is no pill, and a note says so.

  The stylesheet is copied verbatim from filefetcher-archiveexpander-chain.html so both read as one
  family. Edit that file's <style> and copy it here, or they drift.

  Regenerate the panel after editing:  python kibana/build-diagram-panels.py
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simple-abc - workflow schematic</title>
<style>
  :root {
    --ground: #EEF0EC;
    --sheet: #FAFBF8;
    --ink: #191D1A;
    --muted: #667069;
    --rule: #D0D6CE;
    --rule-soft: #E1E6DF;
    --ok: #0E6B5E;
    --ok-soft: rgba(14, 107, 94, 0.10);
    --fail: #A8481A;
    --fail-soft: rgba(168, 72, 26, 0.10);
    --sans: "IBM Plex Sans Condensed", "Helvetica Neue", Arial, sans-serif;
    --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121614;
      --sheet: #1A1F1C;
      --ink: #E7EBE5;
      --muted: #97A199;
      --rule: #2E3733;
      --rule-soft: #242C28;
      --ok: #4FBCA6;
      --ok-soft: rgba(79, 188, 166, 0.12);
      --fail: #E09055;
      --fail-soft: rgba(224, 144, 85, 0.12);
    }
  }
  :root[data-theme="dark"] {
    --ground: #121614;
    --sheet: #1A1F1C;
    --ink: #E7EBE5;
    --muted: #97A199;
    --rule: #2E3733;
    --rule-soft: #242C28;
    --ok: #4FBCA6;
    --ok-soft: rgba(79, 188, 166, 0.12);
    --fail: #E09055;
    --fail-soft: rgba(224, 144, 85, 0.12);
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .sheet {
    max-width: 1180px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 36px 64px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* One column by default; at width the lead sits beside the title instead of
     leaving the right half of the sheet empty. */
  .titleblock { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  @media (min-width: 900px) {
    .titleblock { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); column-gap: 48px; }
    .eyebrow { grid-area: 1 / 1; }
    h1 { grid-area: 2 / 1; }
    .standfirst { grid-area: 2 / 2; align-self: end; max-width: none; }
    .facts { grid-area: 3 / 1 / auto / -1; }
  }
  .eyebrow {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }
  h1 {
    font-family: var(--mono);
    font-size: clamp(26px, 4.6vw, 40px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
    text-wrap: balance;
    margin: 0;
  }
  .standfirst {
    max-width: 62ch;
    margin: 0;
    color: var(--muted);
    font-size: 16px;
  }
  .standfirst em { color: var(--ink); font-style: italic; }

  .facts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }
  .fact { background: var(--sheet); padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
  .fact dt {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .fact dd { margin: 0; font-family: var(--mono); font-size: 13px; word-break: break-all; }
  .fact dd.plain { word-break: normal; }
  /* the last fact spans the row it starts, so an odd count leaves no dead cells */
  .facts .fact:last-child { grid-column: 1 / -1; }

  figure { margin: 0; display: flex; flex-direction: column; gap: 14px; }
  .scroller {
    overflow-x: auto;
    border: 1px solid var(--rule);
    background: var(--sheet);
    padding: 8px;
  }
  .scroller svg { display: block; min-width: 940px; width: 100%; height: auto; }
  /* Set in columns rather than one 68ch measure, so the caption fills the sheet
     instead of ending halfway across it. */
  figcaption { color: var(--muted); font-size: 14px; max-width: none; columns: 30em; column-gap: 48px; }
  @media (max-width: 899px) { figcaption { columns: auto; max-width: 68ch; } }

  .node-box { fill: var(--sheet); stroke: var(--rule); stroke-width: 1.4; }
  .node-box-fork { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.4; }
  .node-box-fail { fill: var(--fail-soft); stroke: var(--fail); stroke-width: 1.4; }
  .hop-disc { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.2; }
  .hop-num { fill: var(--ok); font-family: var(--sans); font-size: 11px; font-weight: 700; }
  .n-proc { fill: var(--ink); font-family: var(--sans); font-size: 11.5px; font-weight: 600; }
  .n-proc-ver { fill: var(--muted); font-size: 9px; font-weight: 500; }
  .n-step { fill: var(--muted); font-family: var(--mono); font-size: 8.5px; }
  .n-step-ver { fill: var(--muted); font-size: 7.5px; }
  .n-cfg  { fill: var(--ok); font-family: var(--mono); font-size: 10.5px; }
  .n-cfg-fail { fill: var(--fail); font-family: var(--mono); font-size: 10.5px; }
  .edge-ok { stroke: var(--ok); stroke-width: 1.6; fill: none; }
  .edge-fail { stroke: var(--fail); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  .edge-cancel { stroke: var(--muted); stroke-width: 1.4; fill: none; stroke-dasharray: 2 4; stroke-linecap: round; }
  .stop-bar { stroke: var(--muted); stroke-width: 2.2; }
  .lbl-cancel { fill: var(--muted); font-family: var(--sans); font-size: 11.5px; font-weight: 600; }
  .gate { fill: var(--sheet); stroke: var(--ok); stroke-width: 2; }
  .mk-ok { fill: var(--ok); }
  .mk-fail { fill: var(--fail); }
  .lbl-schema { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
  .lbl-fail { fill: var(--fail); font-family: var(--sans); font-size: 11.5px; font-weight: 600; }
  .lbl-note { fill: var(--muted); font-family: var(--sans); font-size: 11.5px; }
  .lbl-out { fill: var(--ink); font-family: var(--mono); font-size: 11px; }
  .topic-pill { fill: none; stroke: var(--ink); stroke-width: 1.2; }
  .topic-txt { fill: var(--ink); font-family: var(--mono); font-size: 12px; }
  .legend-txt { fill: var(--muted); font-family: var(--sans); font-size: 12px; }

  section { display: flex; flex-direction: column; gap: 14px; }
  h2 {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  table { border-collapse: collapse; width: 100%; min-width: 800px; font-size: 13px; }
  caption { text-align: left; color: var(--muted); font-size: 14px; padding-bottom: 10px; }
  th {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: left;
    padding: 8px 12px 8px 0;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  td {
    padding: 9px 12px 9px 0;
    border-bottom: 1px solid var(--rule-soft);
    vertical-align: top;
    font-variant-numeric: tabular-nums;
  }
  td.hop { font-family: var(--sans); font-weight: 700; color: var(--ok); width: 1%; }
  td.hop.f { color: var(--fail); }
  td code, .m { font-family: var(--mono); font-size: 12px; }
  td .proc { font-family: var(--sans); font-weight: 600; font-size: 14px; }
  .ec {
    display: inline-block;
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border: 1px solid var(--rule);
    white-space: nowrap;
  }
  .ec.ok { color: var(--ok); border-color: var(--ok); }
  .ec.f { color: var(--fail); border-color: var(--fail); }
  .ec.c { color: var(--muted); border-color: var(--muted); }
  tr.failrow td { background: var(--fail-soft); }
  tr.forkrow td { background: var(--ok-soft); }

  .notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .note { background: var(--sheet); padding: 16px 18px; display: flex; flex-direction: column; gap: 7px; }
  .note h3 { font-family: var(--sans); font-size: 14px; font-weight: 700; margin: 0; letter-spacing: 0.01em; }
  .note p { margin: 0; font-size: 14px; color: var(--muted); }
  .note p strong { color: var(--ink); font-weight: 500; }
  .note code { font-family: var(--mono); font-size: 12px; color: var(--ink); }

  footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--rule); padding-top: 14px; }
  footer .m { color: var(--ink); }

  @media (max-width: 620px) {
    .sheet { gap: 32px; padding-block: 28px 48px; }
  }
</style>
<style>
  body { margin: 0; background: var(--ground); }
  .sheet { max-width: 1120px; margin: 0 auto; padding-block: 40px 64px; }
  .figure { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 24px; }
</style>
</head>
<body>
  <div class="sheet">
    <header class="titleblock">
      <p class="eyebrow">Workflow schematic - skp cluster</p>
      <h1>simple-abc</h1>
    </header>
    <div class="figure">

      <svg viewBox="0 0 1580 330" role="img" aria-label="Three steps in a line on one processor. The entry step makes its own input, hands to a second step, which hands to a third; nothing accepts the third step's output so the run ends there. No schema edges are enforced and no step declares a failure branch.">
        <defs>
          <marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon class="mk-ok" points="0,1 10,5 0,9"></polygon>
          </marker>
        </defs>

        <!-- No inbound topic pill: this workflow consumes nothing. -->
        <text class="lbl-note" x="40" y="41" text-anchor="start">entry step · no inbound topic — the processor makes its own input</text>

        <g>
          <rect class="node-box" x="40" y="120" width="150" height="86"></rect>
          <circle class="hop-disc" cx="58" cy="138" r="12"></circle>
          <text class="hop-num" x="58" y="142" text-anchor="middle">1</text>
          <text class="n-proc" x="115" y="162" text-anchor="middle">sample-proc-v9<tspan class="n-proc-ver">_1.5.0</tspan></text>
          <text class="n-step" x="115" y="179" text-anchor="middle">simple-stepA<tspan class="n-step-ver">_1.0.0</tspan></text>
          <text class="n-cfg" x="115" y="195" text-anchor="middle">label Step_A</text>
        </g>

        <line class="edge-ok" x1="190" y1="163" x2="226" y2="163" marker-end="url(#ar-ok)"></line>

        <g>
          <rect class="node-box" x="232" y="120" width="150" height="86"></rect>
          <circle class="hop-disc" cx="250" cy="138" r="12"></circle>
          <text class="hop-num" x="250" y="142" text-anchor="middle">2</text>
          <text class="n-proc" x="307" y="162" text-anchor="middle">sample-proc-v9<tspan class="n-proc-ver">_1.5.0</tspan></text>
          <text class="n-step" x="307" y="179" text-anchor="middle">simple-stepB<tspan class="n-step-ver">_1.0.0</tspan></text>
          <text class="n-cfg" x="307" y="195" text-anchor="middle">label Step_B</text>
        </g>

        <line class="edge-ok" x1="382" y1="163" x2="418" y2="163" marker-end="url(#ar-ok)"></line>

        <g>
          <rect class="node-box" x="424" y="120" width="150" height="86"></rect>
          <circle class="hop-disc" cx="442" cy="138" r="12"></circle>
          <text class="hop-num" x="442" y="142" text-anchor="middle">3</text>
          <text class="n-proc" x="499" y="162" text-anchor="middle">sample-proc-v9<tspan class="n-proc-ver">_1.5.0</tspan></text>
          <text class="n-step" x="499" y="179" text-anchor="middle">simple-stepC<tspan class="n-step-ver">_1.0.0</tspan></text>
          <text class="n-cfg" x="499" y="195" text-anchor="middle">label Step_C</text>
        </g>

        <line class="edge-ok" x1="574" y1="163" x2="626" y2="163" marker-end="url(#ar-ok)"></line>
        <text class="lbl-note" x="636" y="167" text-anchor="start">ends lineage · no successor accepts it</text>

        <text class="lbl-out" x="40" y="236" text-anchor="start">3 outcomes per cycle · one per step · all Completed — measured over 40 cycles</text>

        <!-- Legend, at the chain's coordinates so the two line up when flipped between. -->
        <line class="edge-ok" x1="40" y1="276" x2="86" y2="276" marker-end="url(#ar-ok)"></line>
        <text class="legend-txt" x="96" y="280" text-anchor="start">Completed — entryCondition 4, Always, on all three steps: a successor is dispatched whatever the predecessor reported</text>
        <text class="legend-txt" x="40" y="310" text-anchor="start">No failure edge and no schema edge is drawn because none exists: the processor declares neither an input nor an output schema, and no step routes a failure</text>
      </svg>

    </div>
  </div>
</body>
</html>
