# processor-kafkaimporter — reads a topic and opens one lineage per record, sending each record's
# value downstream as is. Like processor-sample it has no Service: a pure consumer's only inbound
# traffic is the kubelet hitting the pod IP for probes.
#
# EXPECT IT TO SIT NOT-READY UNTIL A PROCESSOR ROW EXISTS. Readiness reports identity resolution, and
# identity is resolved by asking the API for the row matching this image's embedded SourceHash. Until
# that row is registered the pod is live, healthy and unready — which is correct, and looks exactly
# like a fault if you are not expecting it. `kubectl rollout status` will therefore time out waiting
# for it to go Ready; that timeout is the expected signal, not a fault, and no restart shortens it —
# the fix is registering the row. See k8s/README.md for the registration step.
#
# ONE REPLICA, and this is not a capacity decision. The topic has one partition, and a Kafka consumer
# reads only the partitions assigned to it — so a second replica would own nothing, consume nothing,
# and report "0/100 Drained" for every dispatch that landed on it. The processor's Drained reason
# means "the topic is empty" ONLY under this arrangement. Raising this number, or the topic's
# partition count, invalidates that reason: read §6 of
# docs/superpowers/specs/2026-09-06-path-importer-design.md before changing either. (That document
# predates the rename from PathImporter and still uses the old names; the reasoning is unchanged.)
#
# The broker is org infrastructure outside this cluster and nothing here stands it up -- but its
# ADDRESS is below, in Kafka__BrokerList, because an address is not a workflow author's to choose.
# What travels in the orchestrator's step payload is what an author does choose: the topic, the
# consumer group and the counts. The broker list used to travel there too; it moved on 2026-09-09,
# and payloads written before then still carry an inert `brokerList` key that binding ignores.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-kafkaimporter
  namespace: skp
  labels:
    app: processor-kafkaimporter
    app.kubernetes.io/part-of: skp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0 so an update never briefly runs two members against a one-partition topic. The
      # handover is stop-then-start rather than an overlap.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: processor-kafkaimporter
  template:
    metadata:
      labels:
        app: processor-kafkaimporter
    spec:
      containers:
        - name: processor-kafkaimporter
          image: processor-kafkaimporter:local
          imagePullPolicy: IfNotPresent
          env:
            # NO Service__Name / Service__Version here, deliberately, and do not add them back.
            # A processor takes its service.name and service.version from its database row, resolved
            # before the host is built so they can reach the OTel resource, and that row wins over
            # configuration unconditionally. Setting them here changed nothing: telemetry reported
            # sample-proc-v9 / 1.5.0 whatever this said, so the pair read as live settings while
            # being inert -- an operator renaming a processor by editing this manifest would have
            # seen no effect and no error. The fallback they nominally provided now lives in code
            # (ProcessorHost, "processor" / "1.0.0"), which is where the other two services declare
            # theirs.
            # The replica identity that names this pod's liveness key, its reply queue, and the
            # service.instance.id on its telemetry. All three must be the same string, which is why it
            # is resolved once from the downward API rather than three times from three defaults.
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            # The collector already running in this namespace. Without it the SDK still works and
            # export simply fails quietly, so this is an enrichment rather than a dependency.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            # 10s, against a 15s Prometheus scrape. The collector emits explicit sample
            # timestamps and Prometheus discards a re-scrape bearing one it already stored,
            # so an export interval EQUAL to the scrape interval aliases and leaves some
            # scrapes with nothing new. Exporting faster than the scrape makes the effective
            # resolution the scrape interval.
            #
            # Load-bearing for the dashboards: Grafana derives $__rate_interval from the
            # datasource's timeInterval, which must track this value. At 60s it floored the
            # rate window at 240s, which is why a sixty-second outage moved no rate panel.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "10000"
            # THE ORG'S BROKER. It is infrastructure outside this cluster, owned by someone else and
            # never stood up by anything in k8s/ -- but the ADDRESS of it belongs here, with the
            # RabbitMQ and Redis addresses beside it, because it is not a workflow author's to
            # choose. A step payload names the topic, the consumer group and the counts; one
            # deployment reads one cluster.
            #
            # This is also where the credentials go when the org's broker starts wanting them: a
            # secretKeyRef, exactly like RabbitMq__Password below. They could not go in a step
            # payload -- an assignment row is plaintext jsonb served by the API -- and splitting the
            # address from the credential that authenticates to it would let a step point at a
            # broker its credential does not match, with the mismatch surfacing only as a hang.
            #
            # The value below is the INTERNAL listener of the local dev broker from
            # tools/kafka-dev-broker.ps1, which is a container on the kind network rather than
            # anything in this namespace -- so it resolves by container name and appears in no
            # `kubectl get svc`. Point it at the real cluster wherever this is deployed for real.
            - name: Kafka__BrokerList
              value: "skp-kafka:9092"
            - name: RabbitMq__Host
              value: rabbitmq
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef: { name: skp-dev-secrets, key: RABBITMQ_DEFAULT_USER }
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef: { name: skp-dev-secrets, key: RABBITMQ_DEFAULT_PASS }
            # Straight to Redis, the same address the orchestrator and the API use. This pointed at
            # a toxiproxy hop until 2026-09-01: the proxy was the only way to make a dependency slow
            # rather than absent on this cluster, but it put the processor on a Redis path production
            # does not have, so every latency measured here carried a hop production never pays.
            - name: ConnectionStrings__Redis
              value: "redis:6379,abortConnect=false,connectTimeout=5000"
            - name: ConsoleHealth__Port
              value: "8081"
          ports:
            - containerPort: 8081
          # Startup flips on the liveness loop's first beat, within moments of the host starting, so
          # this passes long before discovery does. It is deliberately not gated on identity: a
          # processor waiting on an unregistered row is starting correctly, however long that takes.
          startupProbe:
            httpGet: { path: /health/startup, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # Readiness is identity resolution. It stays red until the processor row exists, and no
          # restart will help — which is exactly why this is readiness and not liveness.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          # Liveness is the loops still turning, and nothing else. A broker that is down must not
          # restart this pod: the startup loop is designed to retry against it forever, and a restart
          # only throws away the backoff progress.
          livenessProbe:
            httpGet: { path: /health/live, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests: { memory: "160Mi" }
            limits:   { memory: "384Mi" }
