        {
          "id": 7,
          "type": "stat",
          "title": "Data freshness",
          "description": "Seconds since the least-fresh service last exported anything.\n\nEvery other panel on this board is downstream of this number. The export cadence is 10s against a 15s scrape, so the effective resolution is 15s and this sawtooths 0-15 in health. Orange at 45 -- three missed samples -- and red at 90. Sustained above green means a service has stopped reporting and its gauges are being held at whatever they last said.\n\nThe TelemetryStale alert rule fires off the same 45, deliberately, so the alert and this panel change colour at the same instant.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "time() - min(max by (service_name) (timestamp(pipeline_gate_open_ratio))) or vector(0)",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
