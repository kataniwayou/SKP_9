          "type": "timeseries",
          "title": "Queue depth by queue",
          "description": "Messages waiting in each of every queue in the deployment, right now.\n\n**The only leading indicator on these boards.** Every verdict stat is coincident or lagging -- consuming drops once a consumer has already stopped, and a departed replica costs a liveness window plus an export, measured at 52-66s. A queue starts filling the moment a consumer is merely SLOWER than its producer, which is the shape of most real degradations and which nothing here could previously see.\n\n**It is also what separates a queued message from a lost one.** The hop gaps are a conservation check, so a message sitting in a queue and a message that vanished are the same number to them. A gap roughly equal to the depth here is backlog; a gap far exceeding it is loss.\n\nHealthy on this stack is **0 on every orchestrator queue** and **mean 0.65, max 3** on the processor work queue -- that burst is structural, not noise: a cron fire dispatches a batch, PrefetchCount is 1, and the replicas drain it one message at a time. The reference line is at 5, above that measured maximum.\n\n`max by (queue)` because every replica probes the same queue and reports the same number -- a depth is a property of the broker, not of the replica asking -- so `sum` would multiply it by the replica count. Wrapped in `last_over_time(...[40s])` so a departed reporter's held sample cannot win the max.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 27
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (queue) (last_over_time(pipeline_queue_depth{}[40s]))",
              "legendFormat": "{{queue}}",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "spanNulls": false,
                "showPoints": "never",
                "pointSize": 4,
                "axisPlacement": "auto",
                "axisLabel": "",
                "scaleDistribution": {
                  "type": "linear"
                },
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "mappings": [],
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 5
                  }
                ]
              },
              "min": 0,
              "noValue": "no queue depth reported -- nothing is probing these queues"
            },
            "overrides": []
          }
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "Consumers attached by queue",
          "description": "How many consumers **the broker** has on each queue. Zero means nothing is listening.\n\n**This is now the ONLY signal that anything is listening, and that is why the process's own assertion was retired.** `pipeline.consumer.consuming` was the process saying so about itself, which is why every panel reading it had to wrap it in a liveness window -- a dead replica's copy was held at 1 by the collector, so it read healthiest exactly when the replica was gone. This number comes from the broker's own reply and is 0 the moment a consumer detaches.\n\n**The liveness wrap is still load-bearing here, and it was measured.** Unwrapped, `max by (queue)` read a confident 2 against the broker's 0 for a whole processor outage, because it picked the departed pods' stale series over the orchestrator's fresh 0. Wrapped, it reads 0 within one liveness window.\n\nExpect 3 on the shared orchestrator queues (one per replica), 1 on each per-replica control queue, and 2 on the processor work queue. A count that drops without `Workers reporting` moving is a consumer that detached while its process stayed up.\n\nNot a complete answer: a consumer that reattaches inside one 10s probe interval -- which is what the S9 flapping-connection scenario produced -- is invisible here.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 27
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (queue) (last_over_time(pipeline_queue_consumers{}[40s]))",
              "legendFormat": "{{queue}}",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "gradientMode": "opacity",
                "spanNulls": false,
                "showPoints": "never",
                "pointSize": 4,
                "axisPlacement": "auto",
                "axisLabel": "",
                "scaleDistribution": {
                  "type": "linear"
                },
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "mappings": [],
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "min": 0,
              "noValue": "no consumer count reported -- nothing is probing these queues"
            },
            "overrides": []
          }
        },
        {
          "id": 23,
          "type": "timeseries",
          "title": "Queue wait by queue",
          "description": "Seconds a delivery sat in the broker between the publish and this service picking it up, per queue.\n\n**Neither produce duration nor consumer duration contains this term.** Produce duration ends at the broker's confirmation; consumer duration begins when the delivery reaches this process. The wait between them was unmeasured, which is how an end-to-end time could grow with every component still looking fast.\n\n**TWO SERIES BECAUSE THE RAW ONE IS WRONG.** The sent header is stamped before the publish, so the sender's own publisher confirm -- about 12 of ~13ms on this stack -- sits inside this number AND inside produce duration. The net series subtracts it and is the one to read; the raw series is here to show how much of it was never broker wait at all.\n\n**Net is directional, not exact.** It is a difference of two means taken over different populations -- different messages, different processes -- so do not read a millisecond off it. Near zero is the healthy reading. Growing is real queueing, and `Queue depth by queue` beside it says how deep while `Consumers attached by queue` says whether anything is still draining it.\n\n**Three parts of that expression are load-bearing and each fails to NO-DATA rather than to an error.** `label_replace` renames `destination` to `queue`: the two hold the same string under different label names, and no vector match joins them without it. `avg by (queue)` on BOTH sides, before the subtraction, because the halves come from different processes -- `instance` and `job` differ, so an unaggregated match is many-to-many, which returns nothing. And the produce side is filtered by destination rather than by service, because the sender is not this board's service. A blank net series with a drawn raw one means one of the three has been broken.\n\n**Recorded only when the message carried a send timestamp.** A message published by a build without the header has none, and during a rollout there are always some -- they are skipped rather than recorded as zero, which would bury the real distribution. The API's queue side stamps nothing at all.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 27
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg by (queue) (rate(pipeline_queue_wait_seconds_sum{}[$__rate_interval]) / rate(pipeline_queue_wait_seconds_count{}[$__rate_interval]))",
              "legendFormat": "raw {{queue}}",
              "range": true,
              "editorMode": "code"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg by (queue) (rate(pipeline_queue_wait_seconds_sum{}[$__rate_interval]) / rate(pipeline_queue_wait_seconds_count{}[$__rate_interval])) - on(queue) group_left avg by (queue) (label_replace(rate(pipeline_produce_duration_seconds_sum{}[$__rate_interval]) / rate(pipeline_produce_duration_seconds_count{}[$__rate_interval]), \"queue\", \"$1\", \"destination\", \"(.*)\"))",
              "legendFormat": "net {{queue}}",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": null,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "gradientMode": "opacity",
                "spanNulls": false,
                "showPoints": "never",
                "pointSize": 4,
                "axisPlacement": "auto",
                "axisLabel": "",
                "scaleDistribution": {
                  "type": "linear"
                },
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "noValue": "no deliveries carrying a send timestamp in range"
            },
            "overrides": []
          }
        },
        {
          "id": 24,
          "type": "table",
          "title": "Message flow matrix",
          "description": "Every message type, produced against consumed, with the difference. The quickest way to see a type that is produced and never consumed.\n\n**Grouped by type ALONE, and that is the whole point of the panel.** It used to group by `(service_name, type)` on both sides and merge them -- but the producer and the consumer of a type are DIFFERENT SERVICES, so the merge key never matched and the two halves of every hop landed on separate rows with the other column blank. Observed on this stack: `orchestrator / process-dispatch` produced 0.413 with consumed empty, and two rows below `sample-proc-v9 / process-dispatch` consumed 0.510 with produced empty. A reader had to do the join by eye, across non-adjacent rows, and a 23% discrepancy read as normal. A conservation table that cannot put the two sides of a conservation on one row is not one.\n\nDropping `service_name` is what buys the pairing, and it costs the who: read that off `Produced by type and outcome` and `Consumed by type and disposition` on the worker boards, which are per-service by construction.\n\n**`gap /s` is produced minus consumed, so it should hover at zero.** It is a difference of two independently scraped rates, so expect jitter either side -- measured over an hour, p50 +0.000 and max +0.074 req/s. A gap that holds one sign and grows is the signal; the hop-gap stats above count the same thing in messages, where a real leak accumulates and jitter does not.\n\n`step-outcome` should bias POSITIVE **over a long enough range**, because the API consumes it too and the API's queue side emits no metrics at all -- so `consumed` undercounts that hop. Do not expect to see it at a one-minute rate window, where jitter is several times larger than the bias: measured at one instant, +0.015, and at another, -0.060.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 35
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (type) (rate(pipeline_messages_produced_total[$__rate_interval]))",
              "legendFormat": "produced",
              "range": false,
              "editorMode": "code",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (type) (rate(pipeline_messages_consumed_total[$__rate_interval]))",
              "legendFormat": "consumed",
              "range": false,
              "editorMode": "code",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "produced /s",
                  "Value #B": "consumed /s"
                }
              }
            },
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "produced /s",
                  "operator": "-",
                  "right": "consumed /s"
                },
                "alias": "gap /s",
                "replaceFields": false
              }
            }
          ],
          "options": {
            "showHeader": true,
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byType",
                  "options": "number"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 3
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "gap /s"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "noValue",
                    "value": "one side only"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "special",
                        "options": {
                          "match": "nan",
                          "result": {
                            "text": "one side only",
                            "color": "text",
                            "index": 0
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "text",
                          "value": -0.1
                        },
                        {
                          "color": "orange",
                          "value": 0.1
                        },
                        {
                          "color": "red",
                          "value": 0.3
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          }
        }
      ]
    }
  skp-orchestrator.json: |
    {
      "id": null,
      "uid": "skp-orchestrator",
      "title": "SKP Orchestrator",
      "description": "Orchestrator control plane -- 3 replicas across 5 queues. The panel set mirrors SKP Processor and is generated from the same helpers, with pipeline.leader standing in for pipeline.identity.ready, plus two panels for pipeline.hydration.admitted, which exists on no other host.",
      "tags": [
        "skp",
        "skp-orchestrator",
        "pipeline"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 0,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "links": [
        {
          "title": "SKP boards",
          "type": "dashboards",
          "tags": [
            "skp"
          ],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link",
          "tooltip": "",
          "url": ""
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "hide": 0,
            "current": {},
            "options": []
          },
          {
            "name": "service_name",
            "type": "constant",
