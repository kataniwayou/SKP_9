        {
          "id": 20,
          "type": "state-timeline",
          "title": "Posture - consumers, gate, leader, hydration, identity",
          "description": "Why the pipeline stopped, in one panel. Every series should sit at 1 -- leaders elected included.\n\n**The first row is the one that actually moves**, and it is broker-side now. It used to be `pipeline.consumer.consuming` -- the only posture signal to change in the Redis, broker and both-down scenarios -- and that instrument is retired, because it was the process asserting its own health and a departed replica's copy was held at 1. `pipeline.queue.consumers` is the broker's own count, clamped to a posture: 0 when ANY queue in the deployment has nothing attached to it, 1 when they all do. `Queues unconsumed` above is the same fact as a number.\n\nEvery series is restricted to replicas reporting inside 40s, so a replica going away ends its row rather than freezing it at 1.\n\n**One row per signal.** As overlaid lines this was six booleans on one axis: they all sit at 1 in health, so they rendered as a single line and a dip could not be attributed to any of them. The panel that was supposed to say *why the pipeline stopped* could say only *something did*.\n\n`leaders elected` is a count rather than a posture and is the one row here that can legitimately exceed 1. Two is a split brain; the colour will not tell you so, the tooltip will.",
