          "description": "Deliveries acked having done no work, because the entry was already absent. The primary idempotence mechanism; invisible under disposition=acked. Rare is fine, frequent is a question.\n\n**This instrument has never emitted a series on this stack**, before or after a deliberate L2 wipe -- checked against Prometheus, which carries no metric name matching it at all. It is not dead code: `ProcessDispatchHandler` does call `RecordDuplicateSuppressed()`, so the path is wired and this stat will move the first time a duplicate is suppressed. The condition simply has not arisen.\n\nOn the Since tier rather than the verdict tier because a suppressed duplicate is not a fault in progress, and because a permanently-zero stat on a row an operator scans for colour is one more thing teaching them that this row is always green.",
