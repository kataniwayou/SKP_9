            "y": 22
          },
          "options": {
            "mode": "markdown",
            "content": "**This board still covers the API's HTTP surface only, and that is now a gap in the BOARD rather than in the instruments.**\n\nAs of 2026-08-27 this host reports eleven pipeline instruments, not two: `messages.produced`, `produce.duration`, `messages.consumed`, `consumer.duration`, `queue.wait`, `loop.iterations`, `gate.open`, `gate.probe.duration`, `process.start.timestamp`, and the queue-depth and attached-consumer gauges it always had.\n\nTwo do not apply: `identity.ready`, because a control-plane host resolves no identity row, and `deadletter.depth`, because this host owns no dead-letter queue. `gate.trips` is registered and seeded but exports no series on ANY host -- an open question, not an API-specific gap.\n\n**What this panel used to say was that the API's publishes and its consumption emitted nothing at all.** That held until the recorders moved into `Messaging.Transport`, below both base libraries, so the API's own copies of the gate and the gated consumer could reach them. The egress pair needed no new instrumentation whatsoever -- `QueueSender` had been measuring every publish and dropping it for want of one `AddMeter`.\n\nSo a produced-vs-consumed comparison that crosses into the API now balances, and absence here is evidence of zero traffic rather than of zero measurement. The panels that read these instruments are on SKP Processor and SKP Orchestrator; this board has not been rebuilt around them yet."
