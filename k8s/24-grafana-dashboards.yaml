        {
          "id": 25,
          "type": "stat",
          "title": "Not acked",
          "description": "Measures `pipeline.messages.consumed` with disposition requeued or parked, over the last 5m. Split by `reason` on `Messages consumed by disposition`.\n\nA redelivery counts twice, by design: a delivery whose ack the broker never heard comes back and increments again.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "((sum(increase(pipeline_messages_consumed_total{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",disposition=~\"requeued|parked\"}[5m])) or vector(0)) > (clamp_min((sum(pipeline_messages_consumed_total{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",disposition=~\"requeued|parked\"}) or vector(0)) - (sum(pipeline_messages_consumed_total{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",disposition=~\"requeued|parked\"} offset 5m) or vector(0)), 0))) or (clamp_min((sum(pipeline_messages_consumed_total{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",disposition=~\"requeued|parked\"}) or vector(0)) - (sum(pipeline_messages_consumed_total{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",disposition=~\"requeued|parked\"} offset 5m) or vector(0)), 0))",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
