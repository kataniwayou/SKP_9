              "description": "Measures `process_runtime_dotnet_thread_pool_threads_count` per replica.\n\nRead beside the queue length: a queue rising while this stays FLAT is starvation; rising while this CLIMBS is the pool injecting and merely lagging arrivals. At prefetch 1, one blocked callback is one idle replica.",
