        {
          "id": 14,
          "type": "stat",
          "title": "Workers missing (5m)",
          "description": "The deepest dip in live worker count over the last five minutes. Names how many replicas went away, without having to be told how many there ought to be -- it reads 3 for a lost orchestrator StatefulSet and 2 for a lost processor pair.\n\n**Five minutes, not the visible range.** Peak-minus-trough over $__range makes the number change when the reader zooms, and made back-to-back scenarios report the earlier, deeper one: 3 during the processor scenario, whose own answer was 2. A stated window is worth more than a wider one.\n\n**Peak minus trough, not peak minus now.** The dip is narrow and a stat panel is a range query at the datasource step, so a subtraction against the current value lands on the wrong side of the dip about half the time -- measured at the old 60s step, where it missed an outage the same expression had caught an hour earlier. The step is 15s now, but the `[5m:15s]` subqueries pin the evaluation at 15s regardless of it, which is what keeps this independent of the panel's own step.\n\n**It cannot be prompt.** A replica is only missing once it has skipped its liveness window, so detection takes roughly the liveness window plus one export. Nothing queryable fixes the remainder: a fault shorter than the sampling period is not observable.",
