              },
              "expr": "sum(rate(pipeline_gate_probe_duration_seconds_sum{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",outcome=\"healthy\"}[$__rate_interval])) / sum(rate(pipeline_gate_probe_duration_seconds_count{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",outcome=\"healthy\"}[$__rate_interval]))",
              "legendFormat": "mean",
              "range": true,
              "editorMode": "code"
            }
          ],
