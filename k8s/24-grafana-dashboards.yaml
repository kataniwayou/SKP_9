        {
          "id": 12,
          "type": "stat",
          "title": "Dead-lettered",
          "description": "Work this deployment refused and **nobody has dealt with**. Should be 0. Anything else is a run that lost progress permanently and is still sitting in a queue with no consumer.\n\n**The one stat here that reports a LEVEL rather than an event.** `Retry amplification` and the parked disposition beside it are counters: they rise when a message is refused, stay visible for a rate window, and scroll away. This keeps reporting for as long as the message is still there.\n\n**Measured, and it is why this exists.** Six parked step outcomes were found in `orchestrator-result.dead` from four incidents across two days -- each a workflow run that lost progress. Every board read green, all five alert rules stayed inactive, and they were found only by querying the broker by hand. The counter had done its job at the time and had nothing left to say two days later.\n\n`max by (queue)` before the sum is load-bearing: every orchestrator replica probes the same queues and reports the same depth, because a queue depth is a property of the broker rather than of the replica asking. `sum` alone would multiply it by the replica count.\n\nThe window is 2m rather than the 40s used elsewhere: the probe runs every 30s by design -- a dead-letter queue changes only when something is refused, which is rare and never urgent to the second -- so a liveness-width window would flap on the probe's own cadence rather than on anything real.\n\n**No `or vector(0)`:** no probe reporting and no messages dead-lettered are different facts, and a fallback to zero would paint both green. Only the orchestrator runs the probe, so this reads as text if it stops -- see `Dead-letter depth by queue` on the worker boards.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(max by (queue) (last_over_time(pipeline_deadletter_depth[2m])))",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
