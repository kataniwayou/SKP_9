            "current": {
              "text": "orchestrator",
              "value": "orchestrator"
            },
            "hide": 2,
            "skipUrlSync": false
          },
          {
            "name": "service_version",
            "label": "Version",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(pipeline_gate_open_ratio{service_name=\"orchestrator\"}, service_version)",
            "query": {
              "qryType": 1,
              "query": "label_values(pipeline_gate_open_ratio{service_name=\"orchestrator\"}, service_version)",
              "refId": "var-service_version"
            },
            "refresh": 2,
