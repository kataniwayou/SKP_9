            },
            {
              "id": 58,
              "type": "timeseries",
              "title": "Allocation rate",
              "description": "Bytes allocated per second -- **upstream of every other panel in this row.** Collections, pause time and committed memory are all consequences of this number; it is the one that moves first when a transform starts allocating per message.\n\nExpect it to track the consumed rate. Allocation climbing while `Consumer paths` stays flat means the cost per message grew, which is a code change rather than a load change.",
