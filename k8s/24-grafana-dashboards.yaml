                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(changes(pipeline_process_start_timestamp_seconds{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\"}[$__range])) or vector(0)",
              "legendFormat": "",
              "range": true,
