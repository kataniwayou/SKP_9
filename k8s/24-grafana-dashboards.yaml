          "id": 49,
          "type": "stat",
          "title": "Not acked (5m)",
          "description": "Deliveries the consumer refused or sent back **in the last 5m**. Drill into 'reason' on the pipeline tier for why, and read the Since tier for the same count over the range.\n\nCounted rather than rated. Measured at the old 60s export cadence, when the rate window here was 240s: as a rate this read 0.00 through every scenario in the chaos suite, because the single parked delivery the broker outage produced was 1/240 = 0.004, which rounds to nothing at any sane precision. The window is 60s now, which makes that same delivery 0.017 -- still nothing at this precision, which is why the panel is still counted rather than rated.\n\n**A redelivery is counted here twice and that is not a defect.** With `landed` retired, a delivery the broker never heard the ack for comes back and increments `consumed` again -- so a lost ack, which used to have a stat of its own, now shows up as ingress the pipeline did not need. `Dead-letter depth by queue` is the check for a park that never landed: a park the broker was not told about is redelivered rather than dead-lettered, so it never arrives there.",
