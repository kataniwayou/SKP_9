        {
          "id": 87,
          "type": "stat",
          "title": "Restarts (1h)",
          "description": "How many times any replica restarted in the last hour. The gauge holds the process start time and moves exactly once per process, so changes() over a window is the restart count.\n\n**It works because InstanceId resolves to POD_NAME**, which is stable across container restarts within a pod -- a restart moves the value on an EXISTING series rather than creating a new one, which is what changes() needs to see it at all.\n\n`max` rather than `sum` across replicas: this answers *did anything restart*, and a sum would report a rollout of two replicas as two restarts of one.\n\n**Beside `Process restarts`, which infers the same fact rather than measuring it**: that one reads `resets()` on the JIT-compiled-methods counter going backwards, over the visible range. Two derivations of one event, deliberately kept together -- this gauge moves exactly once per process and cannot be fooled by a counter that merely paused, and a disagreement between the two is worth a look.\n\nThe windows differ on purpose: this one is a fixed hour, so its number does not change when the reader zooms, and its neighbour follows the visible range.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
