        },
        {
          "id": 6,
          "type": "stat",
          "title": "Queues unconsumed",
          "description": "How many queues the **broker** currently has no consumer on. Should be 0.\n\n**`max by (queue)` before the count, and the chaos suite is what caught its absence.** Every replica probes every queue, so this instrument carries one series per reporter per queue -- 17 series for the 7 queues this deployment has. Counting series rather than queues made the stat read **17** during the broker outage, and 3 and 5 during two others: a panel titled *queues* reporting more than twice as many as exist.\n\nIt read 0 either way on a healthy stack, which is why it survived review, an expression check and a rendered-board audit. The number is only wrong when it is non-zero, and it is only non-zero during an outage.\n\n**The fastest signal on this board for a consumer that has gone away**, and the only one that does not depend on a process reporting on itself. It is also the only one left: `pipeline.consumer.consuming` was the process's own assertion about itself and is retired, because a departed replica's copy was held at 1 by the collector -- it read healthiest exactly when the replica was gone. Measured against a processor outage this reached 1 within one liveness window, while depth was still reading 1.\n\nIt does not name the queue -- `Consumers attached by queue` on the worker boards does. And it cannot see a consumer that reattaches inside the 10s probe interval, which is what the S9 flapping-connection scenario produced.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(max by (queue) (last_over_time(pipeline_queue_consumers[40s])) == 0) or vector(0)",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
