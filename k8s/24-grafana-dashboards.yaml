              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (queue) (last_over_time(pipeline_queue_depth{queue=~\"processor-$processorId\"}[40s]))",
              "legendFormat": "{{queue}}",
              "range": true,
              "editorMode": "code"
            }
          ],
