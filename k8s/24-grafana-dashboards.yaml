            "mode": "markdown",
            "content": "This board covers the API's **HTTP surface only**.\n\n`BaseApi.Core/Messaging/GatedQueueConsumer.cs` is a separate copy of the consumer with its own observability wiring, and the API host does not register the `Messaging.Transport` meter. So the API's `start-orchestration` publish and its `step-outcome` consumption emit **no metrics at all**.\n\nAbsence on the Flow board is therefore not evidence of zero traffic through the API's queues, and any produced-vs-consumed comparison that crosses into the API will not balance.\n\nDeliberate, not an oversight. The reasoning is in section 10, 'Out of scope', of `docs/superpowers/specs/2026-08-22-pipeline-metrics-design.md` in the SK_P repository, which also names the second dark path: `QueueFanoutPublisher` IS instrumented, but its only callers are the API's start and stop handlers, whose host never registers the `Messaging.Transport` meter -- so the instrument exists and emits nothing."
