            "mode": "markdown",
            "content": "`role` is an attribute on **three instruments only**: `pipeline.messages.produced`, `pipeline.messages.consumed` and `pipeline.produce.duration`. Verified against the live stack.\n\nThe gauges (`gate.open`, `leader`, `hydration.admitted`, `consumer.consuming`, `consumer.inflight`) and `consumer.channel.resets` carry **no** `role`, so the filter is applied only to the four panels that can honour it. Applying it board-wide would empty the rest, because a `role=~\"leader\"` matcher does not match a series that has no `role` label.\n\nThe verdict tier is deliberately left unfiltered as well: it answers *is anything wrong anywhere*, and a role selection there would let a follower fault hide behind a leader view."
