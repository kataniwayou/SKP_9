        {
          "id": 8,
          "type": "stat",
          "title": "Step p95",
          "description": "**Door to door: how long a workflow step actually takes**, from the orchestrator dispatching it to the orchestrator being told it finished.\n\nThe only number on these boards that measures what a WORKFLOW experiences rather than what a component does. Every other duration here is one component's share -- a broker round trip, the author's transform, a store probe -- and a step can get slower without any of them moving.\n\n**It closes the fault this board set could not see.** S10 injects 300ms of Redis latency on the processor's path only; the write-up of it records that *nothing showed it, not one panel, not one stat*. Measured again with this instrument in place: p95 **0.050-0.060s** healthy against **0.973s** during the fault, and the mean 0.036s against 0.835s. Sixteen times on the quantile, twenty-three on the mean.\n\n**Read on `step-outcome` deliveries only**, which is where the round trip completes. The same instrument on other types reports a partial: on `process-dispatch` at the processor it is the dispatch's own queue wait, because the step has only just begun.\n\n**Both ends of this are stamped on different processes**, so it carries NTP skew -- nil on this single node, milliseconds to tens across nodes. Irrelevant at this magnitude, and the reason the bucket ladder starts at 10ms rather than pretending to resolve a 24ms hop.\n\nBlank means no steps completed in the window, not a broken query: a quantile over an all-zero rate is NaN, which `or vector(0)` cannot rescue.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(pipeline_step_elapsed_seconds_bucket{type=\"step-outcome\"}[$__rate_interval])))",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "red",
                    "value": 1.0
                  }
                ]
              },
              "noValue": "no steps completed in range"
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Data freshness",
          "description": "Seconds since the least-fresh service last exported anything.\n\nEvery other panel on this board is downstream of this number. The export cadence is 10s against a 15s scrape, so the effective resolution is 15s and this sawtooths 0-15 in health. Orange at 45 -- three missed samples -- and red at 90. Sustained above green means a service has stopped reporting and its gauges are being held at whatever they last said.\n\nThe TelemetryStale alert rule fires off the same 45, deliberately, so the alert and this panel change colour at the same instant.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "time() - min(max by (service_name) (timestamp(pipeline_gate_open_ratio))) or vector(0)",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
