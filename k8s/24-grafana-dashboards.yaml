          "id": 16,
          "type": "stat",
          "title": "Pods reporting",
          "description": "How many pods of each selected class are currently reporting metrics - the availability readout for this stack, which has no process-uptime metric. Expected when healthy: orchestrator 3, keeper 2, processor 2, WebApi 1. Investigate immediately when a class sits below its expected count: a pod is down, crash-looping, or has lost its link to the metrics collector. This counts pods that are exporting, so it can lag a real restart by up to one scrape interval.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 56
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "range": true,
              "expr": "count by (source) (process_runtime_dotnet_gc_collections_count_total{source=~\"$source\", service_instance_id=~\"$pod\", generation=\"gen0\"})",
              "legendFormat": "{{source}}"
            }
          ]
        },
        {
          "id": 17,
          "type": "stat",
          "title": "Process restarts in range",
          "description": "A restart signal for the selected window, standing in for process uptime, which this stack does not measure. Expected: 0. Investigate any non-zero value together with the Pods reporting panel and kubectl get pods RESTARTS. Two limits matter. It detects a counter resetting inside a still-living process, so a pod replaced outright starts a fresh series and is NOT counted here - measured during Phase 87, a full roll of every deployment produced 0 on this panel. And the metrics collector expiring an idle series can look like a reset. Treat any non-zero reading as a prompt to go and check, never as a certified restart count.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 64
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
