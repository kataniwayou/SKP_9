        {
          "id": 99,
          "type": "timeseries",
          "title": "Consumer duration by disposition",
          "description": "How long a delivery was held, on every path including the ones that never reached a handler. Split by disposition so a slow success and a slow refusal cannot average into a number describing neither.\n\n**Wider than the pipeline.process.duration it replaces**, which measured the author's transform alone and so was blank for every delivery that bounced off a shut gate -- exactly the deliveries worth timing during a store outage.\n\nA mean rather than a quantile, deliberately: quantiles off this ladder are interpolation between rung edges, and at the sample counts this board sees they flip between levels rather than moving.",
