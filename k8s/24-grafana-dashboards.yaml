          "title": "Consumer paths",
          "description": "Ingress, split by which exit the delivery took. Exactly one increment per delivery, on every exit path of the consumer.\n\n**Grouped by `reason` rather than by `type`, and that is what makes it triagable.** Without the reason all four requeue causes collapse into one number and `gate_closed` dominates it: during any store outage every in-flight delivery bounces off the shut gate, and that benign flood buries `send_failed` -- a broker send failing inside a handler -- and `escaped`, which is an unhandled path and therefore a bug. Six real pairs exist, not three times six.\n\nThe `type` dimension it used to carry is on `Message flow matrix` on SKP Flow, which is where a produced-against-consumed reading belongs; the queue names the hop here.\n\n`landed` is gone from this instrument, so a redelivered message increments this twice. Ingress exceeding the hop's egress is the shape a lost ack now makes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 11
          },
