                  "sort": "desc"
                }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "ops",
                  "decimals": null,
                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "fillOpacity": 8,
                    "gradientMode": "opacity",
                    "spanNulls": false,
                    "showPoints": "never",
                    "pointSize": 4,
                    "axisPlacement": "auto",
                    "axisLabel": "",
                    "scaleDistribution": {
                      "type": "linear"
                    },
