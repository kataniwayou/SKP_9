    {
      "id": null,
      "uid": "skp-processor",
      "title": "SKP Processor",
      "description": "Processor replicas. service_name is a real multi-select here: a processor takes its name and version from its database row via the two-stage boot, so different images carry different identities.",
      "tags": [
        "skp",
        "skp-processor",
        "pipeline"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 0,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "links": [
        {
          "title": "SKP boards",
          "type": "dashboards",
          "tags": [
            "skp"
          ],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link",
          "tooltip": "",
          "url": ""
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "hide": 0,
            "current": {},
            "options": []
          },
          {
            "name": "service_name",
            "label": "Processor image",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(pipeline_identity_ready_ratio, service_name)",
