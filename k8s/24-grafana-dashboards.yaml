              "unit": "short",
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "gradientMode": "opacity",
                "spanNulls": false,
                "showPoints": "never",
                "pointSize": 4,
                "axisPlacement": "auto",
