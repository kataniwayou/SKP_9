        {
          "id": 3,
          "type": "stat",
          "title": "L2 gate",
          "description": "0 means the gate is shut somewhere and deliveries are being requeued.\n\n**This is what separates a store fault from a broker fault**, and it is on this board for that reason. Without it a Redis outage and a RabbitMQ outage render identically here -- Consuming drops to 0 in both and every other stat stays green -- and telling them apart means opening a worker board. The gate goes with Redis and stays open for the broker, so 'Consuming 0, gate 0' and 'Consuming 0, gate 1' are two different call-outs.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min(last_over_time(pipeline_gate_open_ratio[40s])) or vector(0)",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
