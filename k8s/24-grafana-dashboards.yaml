        {
          "id": 83,
          "type": "timeseries",
          "title": "Channel resets by reason and replica",
          "description": "shutdown, recovered, reopened. Each renumbers delivery tags and is what makes landed=false possible.\n\nSplit per replica on this board for the reason the consuming panel beside it is: every replica consumes the SAME queue, so a sum by queue collapses across them and cannot name which replica is churning.\n\n**Measured, and this is the panel that caught S9.** When one replica of two had its broker connection closed and re-closed for a minute, this counter went 1 to 10 on that replica and stayed at 1 on its peer -- while `Consuming by queue and replica` read 1 throughout, correctly, because automatic recovery restored the consumer inside one export interval and the consuming gauge never carried the fault at all. Aggregated, this panel showed the churn without saying whose it was.",
