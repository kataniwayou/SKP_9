        {
          "id": 71,
          "type": "text",
          "title": "What the Role filter reaches",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 43
          },
          "options": {
            "mode": "markdown",
            "content": "`role` is an attribute on **three instruments only**: `pipeline.messages.produced`, `pipeline.messages.consumed` and `pipeline.produce.duration`. Verified against the live stack.\n\nThe gauges (`gate.open`, `leader`, `hydration.admitted`, `identity.ready`) and the broker-side levels (`queue.depth`, `queue.consumers`, `deadletter.depth`) carry **no** `role`, so the filter is applied only to the panels that can honour it. Applying it board-wide would empty the rest, because a `role=~\"leader\"` matcher does not match a series that has no `role` label.\n\n`Queue wait by queue` is the one panel deliberately left unfiltered on both halves. The wait it corrects for is stamped by the SENDER, which is a different service on the other side of the hop and carries no role of this board's, so a role selection there would subtract a term measured over a population the filter cannot reach.\n\nThe verdict tier is deliberately left unfiltered as well: it answers *is anything wrong anywhere*, and a role selection there would let a follower fault hide behind a leader view."
          },
          "transparent": false
        },
        {
          "id": 72,
          "type": "timeseries",
          "title": "Exception rate",
          "description": "Correlates with rising parked / refused dispositions and with faulted process outcomes. On the visible tier because a rising exception rate is a cause an operator should not have to expand a row to find.",
