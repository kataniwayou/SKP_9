            "name": "role",
            "label": "Role",
            "description": "What this replica WAS when it handled the delivery, not a replica selector -- service_instance_id is that, and one replica carries both values across a leadership change. Reaches the five instruments carrying the ambient tag: messages.produced, messages.consumed, produce.duration, queue.wait and consumer.duration. The gauges and broker-side levels have no role label, so the filter is not applied to them -- a role matcher does not match a series that has no role label, and applying it board-wide would empty them. The Verdict tier is left unfiltered on purpose: it answers *is anything wrong anywhere*, and a role selection there would let a follower fault hide behind a leader view.",
