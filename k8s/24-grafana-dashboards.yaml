              "description": "Managed heap, by generation. **The leak signal**: a gen2 or LOH line that steps up and never comes back down across several collections is retention, and it ends in an OOMKill that every pipeline panel will report as a restart with no cause.\n\nBy generation rather than a single total, because a rising total is normal between collections and says nothing; a rising gen2 FLOOR is the part that does not come back.",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "gridPos": {
                "h": 7,
                "w": 12,
                "x": 0,
                "y": 73
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "expr": "sum by (service_instance_id, generation) (process_runtime_dotnet_gc_heap_size_bytes{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\"})",
                  "legendFormat": "{{service_instance_id}} / {{generation}}",
                  "range": true,
                  "editorMode": "code"
                }
              ],
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true,
                  "calcs": []
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "bytes",
                  "decimals": null,
                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "fillOpacity": 8,
                    "gradientMode": "opacity",
                    "spanNulls": false,
                    "showPoints": "never",
                    "pointSize": 4,
                    "axisPlacement": "auto",
                    "axisLabel": "",
                    "scaleDistribution": {
                      "type": "linear"
                    },
                    "stacking": {
                      "mode": "none",
                      "group": "A"
                    },
                    "hideFrom": {
                      "legend": false,
                      "tooltip": false,
                      "viz": false
                    },
                    "thresholdsStyle": {
                      "mode": "off"
                    }
                  },
                  "mappings": [],
                  "color": {
                    "mode": "palette-classic"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              }
            },
            {
              "id": 81,
              "type": "timeseries",
              "title": "GC committed memory",
              "description": "What the GC has committed from the OS -- **the number the container limit is compared against**, not the managed heap beside it. The two diverge, and the gap is why a pod can be OOMKilled while its heap looks healthy: committed memory is returned to the OS lazily, so it tracks the high-water mark rather than the live set.\n\nRead this against the pod's memory limit; read the heap panel for whether the growth is real retention.",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "gridPos": {
                "h": 7,
                "w": 12,
                "x": 12,
                "y": 73
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "expr": "sum by (service_instance_id) (process_runtime_dotnet_gc_committed_memory_size_bytes{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\"})",
                  "legendFormat": "{{service_instance_id}}",
                  "range": true,
                  "editorMode": "code"
                }
              ],
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true,
                  "calcs": []
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "bytes",
                  "decimals": null,
                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 1,
                    "fillOpacity": 8,
                    "gradientMode": "opacity",
                    "spanNulls": false,
                    "showPoints": "never",
                    "pointSize": 4,
                    "axisPlacement": "auto",
                    "axisLabel": "",
                    "scaleDistribution": {
                      "type": "linear"
                    },
                    "stacking": {
                      "mode": "none",
                      "group": "A"
                    },
                    "hideFrom": {
                      "legend": false,
                      "tooltip": false,
                      "viz": false
                    },
                    "thresholdsStyle": {
                      "mode": "off"
                    }
                  },
                  "mappings": [],
                  "color": {
                    "mode": "palette-classic"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              }
            },
            {
              "id": 82,
              "type": "timeseries",
              "title": "Allocation rate",
              "description": "Bytes allocated per second -- **upstream of every other panel in this row.** Collections, pause time and committed memory are all consequences of this number; it is the one that moves first when a transform starts allocating per message.\n\nExpect it to track the consumed rate. Allocation climbing while `Consumer paths` stays flat means the cost per message grew, which is a code change rather than a load change.",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "gridPos": {
                "h": 7,
                "w": 12,
                "x": 0,
                "y": 80
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "expr": "sum by (service_instance_id) (rate(process_runtime_dotnet_gc_allocations_size_bytes_total{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\"}[$__rate_interval]))",
                  "legendFormat": "{{service_instance_id}}",
