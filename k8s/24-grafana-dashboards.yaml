              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "service_instance_id",
            "label": "Replica",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(pipeline_gate_open_ratio{service_name=\"orchestrator\"}, service_instance_id)",
            "query": {
              "qryType": 1,
              "query": "label_values(pipeline_gate_open_ratio{service_name=\"orchestrator\"}, service_instance_id)",
              "refId": "var-service_instance_id"
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "hide": 0,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "role",
            "label": "Role",
            "description": "What this replica WAS when it handled the delivery, not a replica selector -- service_instance_id is that, and one replica carries both values across a leadership change. Reaches the five instruments carrying the ambient tag: messages.produced, messages.consumed, produce.duration, queue.wait and consumer.duration. The gauges and broker-side levels have no role label, so the filter is not applied to them -- a role matcher does not match a series that has no role label, and applying it board-wide would empty them. The Verdict tier is left unfiltered on purpose: it answers *is anything wrong anywhere*, and a role selection there would let a follower fault hide behind a leader view.",
            "type": "custom",
            "query": "leader,follower",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "hide": 0,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [
              {
                "selected": false,
                "text": "leader",
                "value": "leader"
              },
              {
                "selected": false,
                "text": "follower",
                "value": "follower"
              }
            ]
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 47,
          "type": "row",
          "title": "1 - Verdict: is the orchestrator broken?",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 48,
          "type": "stat",
          "title": "Gate open",
          "description": "Measures `pipeline.gate.open`, minimum across replicas. 1 = the projection store is usable and consumers may run; 0 = the gate is shut and every delivery is being requeued.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min(last_over_time(pipeline_gate_open_ratio{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\"}[40s])) or vector(0)",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 51,
          "type": "stat",
          "title": "Leader",
          "description": "Measures how many replicas hold the lease. Must be exactly 1: 0 means nobody is firing schedules, 2 means a split.\n\n**A follower reading 0 is not a fault**, which is why this COUNTS leaders rather than taking a minimum the way `Identity ready` does on the processor board. Leadership fences cron fires only; followers are expected to consume normally.\n\nDo not read a DEPARTURE off this. A leader releases its lease on graceful shutdown and the SDK flushes that export, so it genuinely reaches 0; a replica killed outright leaves it held at 1.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(last_over_time(pipeline_leader_ratio{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\"}[40s]) == 1) or vector(0)",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 52,
