              "expr": "histogram_quantile(0.99, sum by (le) (rate(pipeline_step_elapsed_seconds_bucket{type=\"step-outcome\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "range": true,
              "editorMode": "code"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(pipeline_step_elapsed_seconds_sum{type=\"step-outcome\"}[$__rate_interval])) / sum(rate(pipeline_step_elapsed_seconds_count{type=\"step-outcome\"}[$__rate_interval]))",
              "legendFormat": "mean",
              "range": true,
              "editorMode": "code"
