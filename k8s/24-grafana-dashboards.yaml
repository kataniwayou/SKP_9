            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "produced /s",
                  "Value #B": "consumed /s"
                }
              }
            },
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "produced /s",
                  "operator": "-",
                  "right": "consumed /s"
                },
                "alias": "gap /s",
                "replaceFields": false
              }
            }
          ],
          "options": {
            "showHeader": true,
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byType",
                  "options": "number"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 3
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "gap /s"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "noValue",
                    "value": "one side only"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "special",
                        "options": {
                          "match": "nan",
                          "result": {
                            "text": "one side only",
                            "color": "text",
                            "index": 0
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
