              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "gradientMode": "opacity",
                "spanNulls": false,
                "showPoints": "never",
                "pointSize": 4,
                "axisPlacement": "auto",
                "axisLabel": "",
                "scaleDistribution": {
                  "type": "linear"
                },
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "thresholdsStyle": {
                  "mode": "line"
                }
