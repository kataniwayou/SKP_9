        {
          "id": 24,
          "type": "stat",
          "title": "Gate open",
          "description": "Measures `pipeline.gate.open`, minimum across replicas. 1 = the projection store is usable and consumers may run; 0 = the gate is shut and every delivery is being requeued.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min(last_over_time(pipeline_gate_open_ratio{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\"}[40s])) or vector(0)",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 27,
          "type": "stat",
          "title": "Leader",
          "description": "Measures how many replicas hold the lease. Must be exactly 1: 0 means nobody is firing schedules, 2 means a split.\n\n**A follower reading 0 is not a fault**, which is why this COUNTS leaders rather than taking a minimum the way `Identity ready` does on the processor board. Leadership fences cron fires only; followers are expected to consume normally.\n\nDo not read a DEPARTURE off this. A leader releases its lease on graceful shutdown and the SDK flushes that export, so it genuinely reaches 0; a replica killed outright leaves it held at 1.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(last_over_time(pipeline_leader_ratio{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\"}[40s]) == 1) or vector(0)",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 28,
          "type": "stat",
          "title": "Hydration admitted",
          "description": "Measures `pipeline.hydration.admitted`, minimum across replicas. 1 once every replica's first hydration pass has finished and consumption was admitted.\n\n**One-shot, and the only thing that separates two states which look identical from outside the process**: not consuming because the store is down, and not consuming because hydration has not finished yet. `Gate open` answers the first; this answers the second.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min(last_over_time(pipeline_hydration_admitted_ratio{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\"}[40s])) or vector(0)",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
