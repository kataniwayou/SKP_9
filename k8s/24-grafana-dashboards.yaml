        {
          "id": 98,
          "type": "timeseries",
          "title": "Loop rate by loop",
          "description": "Every watched loop's actual cadence. l2-gate should sit at 0.2/s, processor-liveness and queue-depth at 0.1/s.\n\n**This is what the liveness health checks cannot say.** A stale window is binary -- it fires at 15s or 30s and says nothing before that -- while a loop running at 0.12/s instead of 0.2/s is degrading and still green on every probe.\n\nZero means the loop is gone, and it is a READING rather than an absence: the counter is seeded with Add(0) per loop at startup, so the series exists from the first export whether or not the loop has ever run. An empty panel here is a process that is not reporting at all.",
