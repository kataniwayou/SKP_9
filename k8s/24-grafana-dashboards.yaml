  skp-flow.json: |
    {
      "id": null,
      "uid": "skp-flow",
      "title": "SKP Flow",
      "description": "Cross-service conservation for the SKP pipeline. The board to open first: it answers whether the system is broken and where, then links out to the source boards. The hop-gap panels span two services and belong to neither source board.\n\nThe verdict tier is split by TENSE. Row 1 is the state right now. Row 2 is the worst thing that has already happened, and those stats stay non-zero after the event that caused them -- deliberately, so an operator arriving late is still told.\n\nRow 2's stats are scoped to the visible range, with ONE exception: `Workers missing (5m)` is fixed at five minutes regardless of the range, so its number does not change when you zoom. Its own description says why.",
      "tags": [
        "skp",
        "skp-flow",
        "pipeline"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 0,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "links": [
        {
          "title": "SKP boards",
          "type": "dashboards",
          "tags": [
            "skp"
          ],
          "asDropdown": false,
          "includeVars": true,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link",
          "tooltip": "",
          "url": ""
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "hide": 0,
            "current": {},
            "options": []
          },
          {
            "name": "processor",
            "label": "Processor",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(pipeline_messages_produced_total{type=\"process-dispatch\"}, destination)",
            "query": {
              "qryType": 1,
              "query": "label_values(pipeline_messages_produced_total{type=\"process-dispatch\"}, destination)",
              "refId": "var-processor"
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "hide": 0,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "1 - Verdict: is it broken right now?",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "System flowing",
          "description": "Total egress across every worker. Zero during a run means the pipeline has stopped, whatever else reads green.\n\n**Slower than the fault you are chasing.** $__rate_interval is 60s on this stack -- the datasource declares a 15s timeInterval, matching the scrape, and Grafana floors the rate window at four times it. So this number averages the last minute and still cannot fall to zero inside a shorter outage.\n\nMeasured at the OLD 60s export cadence, when timeInterval was 60s and $__rate_interval 240s: with the whole pipeline stopped this still read 1.12 req/s a hundred seconds later, and through a sixty-second broker outage it only dipped 1.12 -> 0.92, never leaving green. Those are the numbers that bought the cadence change; a sixty-second fault now falls inside one rate window rather than a quarter of one, so the dilution is four times smaller -- not gone. Read the posture stats beside it for anything shorter than a minute; this one answers 'has throughput changed', not 'is it down'.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(pipeline_messages_produced_total[$__rate_interval])) or vector(0)",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.0001
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Consuming",
          "description": "Minimum across every queue in the deployment, over replicas that have reported in the last 40s.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min(last_over_time(pipeline_consumer_consuming_ratio[40s])) or vector(0)",
              "legendFormat": "",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "L2 gate",
          "description": "0 means the gate is shut somewhere and deliveries are being requeued.\n\n**This is what separates a store fault from a broker fault**, and it is on this board for that reason. Without it a Redis outage and a RabbitMQ outage render identically here -- Consuming drops to 0 in both and every other stat stays green -- and telling them apart means opening a worker board. The gate goes with Redis and stays open for the broker, so 'Consuming 0, gate 0' and 'Consuming 0, gate 1' are two different call-outs.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
