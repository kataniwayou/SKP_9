        {
          "id": 112,
          "type": "timeseries",
          "title": "Queue wait p95 / p99",
          "description": "Seconds a delivery sat in the broker before this service picked it up, per queue.\n\n**Neither produce duration nor process duration contains this term.** Produce duration ends at the broker's confirmation; process duration begins when a handler is entered. The wait between them was unmeasured, which is why an end-to-end time could grow with every component still looking fast.\n\nHealthy is **20-45ms**. A queue whose wait climbs while its peers stay flat is backlog on that queue alone -- `Queue depth by queue` below says how deep and `Consumers attached by queue` says whether anything is still draining it.\n\nRecorded on arrival, before the handler runs, so the transform's own cost is not folded in here as well as on `Process duration`.\n\n**Recorded only when the message carried a send timestamp.** A message published by a build without this instrument has none, and during a rollout there are always some -- they are skipped rather than recorded as zero, which would bury the real distribution. The API's queue side stamps nothing at all.",
