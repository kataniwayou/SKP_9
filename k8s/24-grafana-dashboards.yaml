                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "mappings": [],
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  }
                ]
              },
              "noValue": "no steps completed in range"
            },
            "overrides": []
          }
        },
        {
          "id": 25,
          "type": "timeseries",
          "title": "Queue wait by hop",
          "description": "p95 seconds each message type spent sitting in the broker before a consumer picked it up, per hop.\n\n**The term neither produce duration nor process duration contains**, and therefore the one that goes missing when an end-to-end time grows and no component looks slow. Produce duration ends at the broker's confirmation; process duration starts when a handler is entered. This is the gap between them.\n\nHealthy on this stack is **20-45ms per hop**. A hop that climbs while the others stay flat is backlog on that one queue -- check `Queue depth by queue` and `Consumers attached by queue` for whether anything is still draining it.\n\nRecorded on arrival, before the handler runs, so it does not fold in the transform time `Process duration` already reports.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 27
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le,queue,type) (rate(pipeline_queue_wait_seconds_bucket[$__rate_interval])))",
              "legendFormat": "{{type}} -> {{queue}}",
              "range": true,
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
