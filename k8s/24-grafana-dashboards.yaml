              "expr": "histogram_quantile(0.95, sum by (le,destination) (rate(pipeline_produce_duration_seconds_bucket{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",processorId=~\"$processorId\"}[$__rate_interval])))",
