                    }
                  },
                  "mappings": [],
                  "color": {
                    "mode": "palette-classic"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": null
                      }
                    ]
                  }
                },
                "overrides": []
              }
            },
            {
              "id": 83,
              "type": "timeseries",
              "title": "Lock contention rate",
              "description": "Monitor contentions per second: threads that had to WAIT for a lock rather than take it. **The stall with no external cause** -- gate open, broker healthy, store fast, and throughput down anyway.\n\nIt earns a place on a processor board specifically because the concrete processor is a SINGLETON with per-dispatch state in plain fields, safe only because prefetch is 1. Contention here is the first sign that an author's transform introduced sharing the seam's design does not expect.",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "gridPos": {
                "h": 7,
                "w": 12,
                "x": 12,
                "y": 80
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "expr": "sum by (service_instance_id) (rate(process_runtime_dotnet_monitor_lock_contention_count_total{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\"}[$__rate_interval]))",
                  "legendFormat": "{{service_instance_id}}",
                  "range": true,
                  "editorMode": "code"
                }
              ],
              "options": {
