              "title": "GC collections / sec by generation",
              "description": "**The cause behind the pause time to its left.** Pause seconds answer *how much*, this answers *why*: gen0 is cheap and constant, and a gen2 rate that is anything but near-flat is the collection that actually costs you.\n\nSplit by generation rather than summed, because a summed collection rate is dominated by gen0 and moves for reasons that never cost a millisecond.",
