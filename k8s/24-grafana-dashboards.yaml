        {
          "id": 82,
          "type": "timeseries",
          "title": "Consumers attached by queue",
          "description": "How many consumers **the broker** has on each queue. Zero means nothing is listening.\n\n**This is the only broker-side signal on these boards.** `pipeline.consumer.consuming` is the process asserting its own health, which is why every panel reading it wraps it in a liveness window -- a dead replica's copy was held at 1 by the collector. This number comes from the broker's own reply and is 0 the moment a consumer detaches.\n\n**The liveness wrap is still load-bearing here, and it was measured.** Unwrapped, `max by (queue)` read a confident 2 against the broker's 0 for a whole processor outage, because it picked the departed pods' stale series over the orchestrator's fresh 0. Wrapped, it reads 0 within one liveness window.\n\nExpect 3 on the shared orchestrator queues (one per replica), 1 on each per-replica control queue, and 2 on the processor work queue. A count that drops without `Workers reporting` moving is a consumer that detached while its process stayed up.\n\nNot a complete answer: a consumer that reattaches inside one 10s probe interval -- which is what the S9 flapping-connection scenario produced -- is invisible here.",
