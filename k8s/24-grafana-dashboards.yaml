        {
          "id": 24,
          "type": "timeseries",
          "title": "Step duration p95 / p99",
          "description": "Door-to-door step time over the range: dispatch to outcome, across both services and three broker hops.\n\n**Read this beside `Queue wait by hop`, which is what it decomposes into.** A rise here with flat queue waits is the author's transform or a dependency getting slower; a rise that tracks one hop's wait is backlog on that queue, and `Queue depth by queue` names it.\n\nThe mean rides alongside the quantiles for the reason the produce-duration panel gives: it comes from sum/count and is independent of bucket boundaries, so a wild divergence from p50 means the ladder has stopped fitting the data. **This ladder is deliberately wider than the transport's** -- it reaches 300s rather than stopping at 10s, because a backlogged step is measured in minutes and everything past the last boundary lands in +Inf, where a quantile reports the edge rather than a latency.\n\n**The line at 0.25s is where measured-normal ends**, not an alarm: healthy p95 here is 0.050-0.060s. Under 300ms of injected Redis latency it reached 0.973s.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 27
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(pipeline_step_elapsed_seconds_bucket{type=\"step-outcome\"}[$__rate_interval])))",
              "legendFormat": "p95",
