          "title": "Pods reporting",
          "description": "How many pods of each selected class are currently reporting metrics - the availability readout for this stack, which has no process-uptime metric. Expected when healthy: orchestrator 3, keeper 2, processor 2, WebApi 1. Investigate immediately when a class sits below its expected count: a pod is down, crash-looping, or has lost its link to the metrics collector. This counts pods that are exporting, so it can lag a real restart by up to one scrape interval.",
