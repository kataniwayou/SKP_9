              "expr": "((sum(increase(pipeline_messages_consumed_total{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",processorId=~\"$processorId\",disposition=~\"requeued|parked\"}[5m])) or vector(0)) > (clamp_min((sum(pipeline_messages_consumed_total{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",processorId=~\"$processorId\",disposition=~\"requeued|parked\"}) or vector(0)) - (sum(pipeline_messages_consumed_total{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",processorId=~\"$processorId\",disposition=~\"requeued|parked\"} offset 5m) or vector(0)), 0))) or (clamp_min((sum(pipeline_messages_consumed_total{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",processorId=~\"$processorId\",disposition=~\"requeued|parked\"}) or vector(0)) - (sum(pipeline_messages_consumed_total{service_name=~\"$service_name\",service_version=~\"$service_version\",service_instance_id=~\"$service_instance_id\",processorId=~\"$processorId\",disposition=~\"requeued|parked\"} offset 5m) or vector(0)), 0))",
