                    "value": 50
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Retry amplification",
          "description": "Share of deliveries that will be redone, in MESSAGES over the visible range. Healthy is exactly zero.\n\n**Requeued and parked only.** It used to add a `landed=\"false\"` term for the ack the broker never heard; that dimension is retired, and a delivery whose ack was lost is now redelivered and counted again in the denominator as well as being invisible in the numerator. So this understates the redone share by whatever lost acks cost -- read it beside the two hop gaps, which count the same event as a conservation failure.\n\nCounted rather than rated, and that is what makes it able to fire at all. Measured at the old 60s export cadence: as a ratio of two 240s rates it read 0.0% through every scenario in the chaos suite, including the broker outage that parked a delivery, because one parked message against a 240s denominator was a rounding error. The rate window is 60s now, which would make that same event 4x larger and still a rounding error; one parked message in a fifteen-minute range is a number.\n\nGreen below 1%. Counting rather than rating makes this stat sticky for a range width, and thresholded red-at-any-non-zero it stayed red through the two scenarios AFTER the one that parked a single delivery -- 0.2% of traffic, on the board an operator opens first. A few redone messages is something to notice; a twentieth of all deliveries being redone is the outage.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
