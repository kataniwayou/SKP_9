        {
          "id": 6,
          "type": "stat",
          "title": "Deepest queue",
          "description": "The fullest queue anywhere in the deployment, in messages.\n\n**The one leading indicator in this row.** Everything else here reports a state that has already changed; this one moves while a consumer is merely slower than its producer, before any posture stat has anything to say.\n\nGreen below 5, which clears the measured healthy maximum: every orchestrator queue holds a flat 0 and the processor work queue bursts to 3, because a cron fire dispatches a batch against a prefetch of 1. Red at 20, roughly a minute of nothing being consumed at this workload's dispatch rate.\n\n**A poor outage signal, deliberately.** With the processor deployment scaled to zero this reached only 4 in ninety seconds, because a stalled pipeline stops feeding itself. `Queues unconsumed` beside it is the sharp signal for a total stop. Read this one for degradation, that one for absence.\n\nNo `or vector(0)`: nothing probing and nothing queued are different facts, and a fallback would paint both green.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
