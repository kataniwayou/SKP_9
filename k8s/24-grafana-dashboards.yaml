            "defaults": {
              "unit": "short",
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "spanNulls": false,
                "showPoints": "never",
