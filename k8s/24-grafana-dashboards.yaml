        {
          "id": 33,
          "type": "stat",
          "title": "Restarts",
          "description": "Measures `changes(pipeline.process.start.timestamp)` across replicas over the visible range. The gauge holds the process start time and moves exactly once per process.\n\n`max`, not `sum`: this answers *did anything restart*. It sees an in-place container restart, because InstanceId is the pod name and the value moves on an existing series; a rollout that REPLACES the pod starts a new series instead.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 6
