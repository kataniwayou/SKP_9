# SKP Studio: the visual workflow editor (spec docs/superpowers/specs/2026-10-05-skp-studio-design.md).
#
# A static React build served by nginx. nginx also proxies /api/ to baseapi-service, so the browser
# talks to one origin: BaseApi has no CORS policy, and the studio must not need one.
#
# Build and load (from the repo root; the kind cluster is named "desktop"):
#   docker build -f src/WorkflowStudio/Dockerfile -t workflow-studio:local .
#   kind load docker-image workflow-studio:local --name desktop
#   kubectl apply -f k8s/31-workflow-studio.yaml
# Reach it through k8s/port-forward-realstack.ps1: http://localhost:18081
apiVersion: v1
kind: Service
metadata:
  name: workflow-studio
  namespace: skp
  labels:
    app: workflow-studio
    app.kubernetes.io/part-of: skp
spec:
  selector:
    app: workflow-studio
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-studio
  namespace: skp
  labels:
    app: workflow-studio
    app.kubernetes.io/part-of: skp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-studio
  template:
    metadata:
      labels:
        app: workflow-studio
    spec:
      containers:
        - name: workflow-studio
          image: workflow-studio:local
          # Read the local image store, as the other :local images do.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # AI drawing (2026-10-11): the model key for nginx's /ai/ route, from the skp-ai Secret. Optional: without it the
            # studio runs and /ai answers 503 ("AI drawing is not configured"). Create it with
            #   kubectl -n skp create secret generic skp-ai --from-literal=api-key=<KIMI_API_KEY>
            # then roll the studio (env is read at start). Never put the key in this file.
            - name: KIMI_API_KEY
              valueFrom:
                secretKeyRef: { name: skp-ai, key: api-key, optional: true }
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { memory: "32Mi" }
            limits:   { memory: "128Mi" }
