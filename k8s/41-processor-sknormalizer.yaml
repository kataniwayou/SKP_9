# processor-sknormalizer — applies one provider handler, named on the step payload, to the
# {metadata, content} tree ArchiveExpander produces, and emits a tree of the same contract. A
# downstream transform: it has an input and it produces output, so it is neither an importer nor an
# exporter. No Service — its only inbound traffic is the kubelet hitting the pod IP for probes.
#
# EXPECT IT TO SIT NOT-READY UNTIL A PROCESSOR ROW EXISTS, exactly as the other processors do.
# `kubectl rollout status` will time out; that timeout is the expected signal, not a fault.
#
# THE MEMORY LIMIT IS 768Mi TO MATCH THE PAIR EITHER SIDE, AND THE ARGUMENT IS THE CONTRACT. This
# processor's input schema IS ArchiveExpander's output schema, so whatever that pod may legally emit,
# this one is obliged to hold — and it holds MORE than the collapser does, because a conversion's
# source and its output are both resident while ffmpeg runs. Sizing it lower means a document the
# upstream pod may legally emit is one this pod cannot receive, and that failure is an OOM, which is a
# POISON MESSAGE and not a failed step: the author never returns, the input key is never reclaimed,
# RabbitMQ requeues the unacked dispatch, and the replacement pod dies the same way. Raise
# ArchiveExpander's limit and you must raise this one.
#
# THERE IS NO SIZE CEILING ENV VAR HERE, DELIBERATELY. ArchiveExpander__MaxExpandedBytes already
# bounds the document that reaches this pod, and a second ceiling here would restate an upstream
# guarantee with a second number to keep consistent. What that means in practice: MaxExpandedBytes
# sizes TWO consumers now, and conversion can GROW data — transcoding to a less compressed target
# produces more bytes than it consumed. Nothing bounds output size. Size MaxExpandedBytes with
# conversion headroom.
#
# ffmpeg IS IN THIS IMAGE AND IN NO OTHER. If every item fails conversion on a first deploy, check
# that before checking the data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-sknormalizer
  namespace: skp
  labels:
    app: processor-sknormalizer
    app.kubernetes.io/part-of: skp
spec:
  # Two, for the same reason processor-sample runs two: a processor is a competing consumer on its
  # OWN work queue, so replicas divide the work rather than duplicating it, and the two register
  # under one processor id as separate liveness keys. It costs ffmpeg nothing — the binary is baked
  # into the image, so each replica gets its own at /usr/bin/ffmpeg and starts its own child process
  # per conversion, with its own temp directory. Nothing is shared and nothing contends.
  #
  # WHAT DOES NOT DIVIDE IS THE BLAST RADIUS OF ONE OVERSIZED DOCUMENT. SKNormalizerOptions sets no
  # input ceiling on purpose, so a document that exceeds the 768Mi limit below OOMs its pod, is
  # redelivered, and now has a SECOND replica to land on — the redelivery loop moves rather than
  # staying put, which is a wider outage and a harder one to read. The mitigation is still sizing.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0, and this is sized memory, not caution for its own sake: this pod's limit is
      # 768Mi, double every other processor's 384Mi, so surging past the replica count would want
      # ~2.3Gi on the node at once — a single-node kind cluster already running Postgres, Redis,
      # RabbitMQ, Prometheus, Grafana, an OTel collector, BaseApi, the orchestrator and four other
      # processors. With two replicas and maxUnavailable 1 this is no longer a stop-then-start:
      # one replica keeps consuming throughout, so the gap the single-replica note accepted is gone.
      # (There is no correctness reason to forbid overlap here: this processor consumes from its
      # own RabbitMQ queue as a competing consumer, not a single partition, and there is no volume
      # to contend over — this is purely a node-memory budget call.)
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: processor-sknormalizer
  template:
    metadata:
      labels:
        app: processor-sknormalizer
    spec:
      containers:
        - name: processor-sknormalizer
          image: processor-sknormalizer:local
          imagePullPolicy: IfNotPresent
          env:
            # NO Service__Name / Service__Version here, deliberately, and do not add them back.
            # A processor takes its service.name and service.version from its database row, resolved
            # before the host is built so they can reach the OTel resource, and that row wins over
            # configuration unconditionally. Setting them here changed nothing: telemetry reported
            # sample-proc-v9 / 1.5.0 whatever this said, so the pair read as live settings while
            # being inert -- an operator renaming a processor by editing this manifest would have
            # seen no effect and no error. The fallback they nominally provided now lives in code
            # (ProcessorHost, "processor" / "1.0.0"), which is where the other two services declare
            # theirs.
            # The replica identity that names this pod's liveness key, its reply queue, and the
            # service.instance.id on its telemetry. All three must be the same string, which is why it
            # is resolved once from the downward API rather than three times from three defaults.
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            # The collector already running in this namespace. Without it the SDK still works and
            # export simply fails quietly, so this is an enrichment rather than a dependency.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            # 10s, against a 15s Prometheus scrape. The collector emits explicit sample
            # timestamps and Prometheus discards a re-scrape bearing one it already stored,
            # so an export interval EQUAL to the scrape interval aliases and leaves some
            # scrapes with nothing new. Exporting faster than the scrape makes the effective
            # resolution the scrape interval.
            #
            # Load-bearing for the dashboards: Grafana derives $__rate_interval from the
            # datasource's timeInterval, which must track this value. At 60s it floored the
            # rate window at 240s, which is why a sixty-second outage moved no rate panel.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "10000"
            - name: RabbitMq__Host
              value: rabbitmq
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef: { name: skp-dev-secrets, key: RABBITMQ_DEFAULT_USER }
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef: { name: skp-dev-secrets, key: RABBITMQ_DEFAULT_PASS }
            # Straight to Redis, the same address the orchestrator and the API use. This pointed at
            # a toxiproxy hop until 2026-09-01: the proxy was the only way to make a dependency slow
            # rather than absent on this cluster, but it put the processor on a Redis path production
            # does not have, so every latency measured here carried a hop production never pays.
            - name: ConnectionStrings__Redis
              value: "redis:6379,abortConnect=false,connectTimeout=5000"
            - name: ConsoleHealth__Port
              value: "8081"
            # ABSOLUTE, and it names where the Dockerfile installs the binary vendored under
            # vendor/ffmpeg/. A bare "ffmpeg" would also resolve -- /usr/local/bin is on PATH -- but
            # the two fail differently: with a path, a broken image says "could not start
            # '/usr/local/bin/ffmpeg'" and an operator knows which file to look for, where a PATH
            # lookup leaves them guessing which of several a container might have found.
            - name: SKNormalizer__FfmpegPath
              value: "/usr/local/bin/ffmpeg"
            # Per conversion, not per dispatch. A wedged ffmpeg holds the one prefetched message
            # forever, so this is what turns a hang into a failed step.
            - name: SKNormalizer__ConversionTimeoutSeconds
              value: "300"
          ports:
            - containerPort: 8081
          # Startup flips on the liveness loop's first beat, within moments of the host starting, so
          # this passes long before discovery does. It is deliberately not gated on identity: a
          # processor waiting on an unregistered row is starting correctly, however long that takes.
          startupProbe:
            httpGet: { path: /health/startup, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # Readiness is identity resolution. It stays red until the processor row exists, and no
          # restart will help — which is exactly why this is readiness and not liveness.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          # Liveness is the loops still turning, and nothing else. A broker that is down must not
          # restart this pod: the startup loop is designed to retry against it forever, and a restart
          # only throws away the backoff progress.
          livenessProbe:
            httpGet: { path: /health/live, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests: { memory: "256Mi" }
            limits:   { memory: "768Mi" }
