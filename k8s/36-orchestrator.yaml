# orchestrator — the control plane. Three replicas, and a StatefulSet rather than a Deployment for
# one reason: identity. Each replica mirrors Redis into its own in-memory L1 over its own durable
# fan-out queue, `orchestrator-control.{POD_NAME}`, and a StatefulSet ordinal is the only pod name
# that survives a restart. Under a Deployment every restart would mint a new random pod name, bind a
# new queue to the fan-out exchange, and abandon the old one with its backlog still in it.
#
# ---------------------------------------------------------------------------------------------
# THIS STATEFULSET MUST NEVER BE SCALED DOWN. Scaling UP is safe; scaling down is not, and nothing
# in Kubernetes will stop you. Each replica's queue is durable and never auto-deletes — it has to
# be, so that a replica which is briefly down accumulates its announcements and drains them on
# return. The cost of that is exact: a queue belonging to a replica that is gone for good stays
# bound to `orchestrator-fanout`, receives a copy of every announcement forever, and has nothing
# reading it. It grows without bound and no probe, log or alert here reports it. If a replica must
# be removed permanently, its queue has to be deleted on the broker by hand, in the same change.
# ---------------------------------------------------------------------------------------------
#
# The three probes here answer three different questions, and keeping them apart is what lets a
# dependency outage be survivable rather than fatal:
#
#   /health/startup  — is the hydration loop running? It flips on the loop's first beat, before the
#                      broker or Redis is touched, so it passes within seconds of process start even
#                      while both are down. Its budget therefore covers process start only.
#   /health/ready    — has this replica mirrored L2 into L1 and admitted its consumer? Red for the
#                      whole of any outage, and that is fine: readiness is the one probe that may
#                      fail indefinitely and recover without anything being restarted.
#   /health/live     — are the loops still turning? Nothing it reads touches a dependency.
#
# The readiness probe is new and it is the difference from the earlier shape of this file, where
# hydration was reported through the startup probe. That cost a five-minute budget on a condition no
# restart repairs: past it the kubelet killed the pod, and under podManagementPolicy: Parallel it
# killed all three at once — turning the outage the design prices as survivable into a whole-service
# crash loop. Nothing routes traffic here, so readiness gates only the pod's READY column; 0/1 now
# means "still hydrating", which is exactly what was lost when the claim came off /health/startup.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: skp
  labels:
    app: orchestrator
    app.kubernetes.io/part-of: skp
---
# Exactly the three verbs the leader election performs on exactly the one Lease it contends for, and
# nothing else. `get` reads the current holder, `update` renews or takes the lease, and `create` is
# needed once — the very first replica to run finds no Lease object and makes it. No `list`, `watch`
# or `delete`: LeaderElector polls the single named object, and a Role that could enumerate or
# destroy leases would let a compromised replica interfere with any other election in this namespace.
#
# Getting this wrong is not a quiet failure. LeaderElectionService handles only
# OperationCanceledException, so a 403 from the API server propagates out of a BackgroundService, and
# .NET 8's default BackgroundServiceExceptionBehavior.StopHost takes the whole replica down with it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator-leader-election
  namespace: skp
  labels:
    app: orchestrator
    app.kubernetes.io/part-of: skp
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["orchestrator-leader"]
    verbs: ["get", "update"]
  # `create` cannot carry a resourceNames restriction: the name of an object that does not exist yet
  # is not known to the authorizer, so a create rule naming resources matches nothing and every
  # create is denied. Scoping it to the leases resource in this one namespace is as tight as the
  # authorization model allows.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-leader-election
  namespace: skp
  labels:
    app: orchestrator
    app.kubernetes.io/part-of: skp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orchestrator-leader-election
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: skp
---
# The governing headless Service a StatefulSet requires. Nothing dials in — the orchestrator has no
# inbound surface at all — so this exists to satisfy `spec.serviceName` and to give the pods their
# stable per-ordinal DNS names. clusterIP: None means no virtual IP and no load balancing, which is
# what makes those per-pod names the only thing it publishes.
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: skp
  labels:
    app: orchestrator
    app.kubernetes.io/part-of: skp
spec:
  clusterIP: None
  selector:
    app: orchestrator
  ports:
    - name: health
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orchestrator
  namespace: skp
  labels:
    app: orchestrator
    app.kubernetes.io/part-of: skp
spec:
  # Three. See the scale-down warning at the top of this file before changing it in either
  # direction — up is safe, down leaks a queue that fills forever.
  replicas: 3
  serviceName: orchestrator
  # Parallel, not the OrderedReady default, and this one is load-bearing — it and the readiness
  # probe below are load-bearing *together*, and neither is safe to remove while the other stands.
  # A pod is Ready only once it has hydrated, so under OrderedReady the kubelet would not create
  # orchestrator-1 until orchestrator-0 was Ready: a Redis that is slow or down at deploy time would
  # not leave three replicas patiently retrying, it would leave one retrying and two that do not
  # exist. The dependency outage the design prices as "not a crash" would become a whole-service
  # non-deploy. Adding the readiness probe under the old OrderedReady default would have caused
  # exactly that, which is why it could not be added until this field was set.
  #
  # Nothing here needs the ordering OrderedReady buys. These replicas share no state, each owns its
  # own durable fan-out queue named after its own ordinal, and which one dispatches is decided by a
  # Lease rather than by who started first.
  #
  # This field cannot be changed in place: Kubernetes rejects an update to it on an existing
  # StatefulSet. Applying this over a deployment created without it means deleting the StatefulSet
  # with --cascade=orphan and re-applying, which leaves the running pods alone.
  #
  # updateStrategy is deliberately left unset. Its default, RollingUpdate, is what this wants, and
  # its behaviour under the same outage is the safe one: a rollout that cannot bring a new pod to
  # Ready stalls with the previous pods still running, rather than emptying the set. podManagementPolicy
  # is stated because its default is the harmful one; there is nothing to correct here.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      # Without this the pods run as `default`, which has no lease permissions, and every replica
      # dies on its first election attempt. See the Role above.
      serviceAccountName: orchestrator
      containers:
        - name: orchestrator
          image: orchestrator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: Service__Name
              value: orchestrator
            - name: Service__Version
              value: 0.0.0
            # The identity this replica is built on, and it feeds four things that must agree: the
            # name of its fan-out queue and dead queue, the holder identity it writes into the
            # leader Lease, and the service.instance.id on its telemetry. Resolved once from the
            # downward API rather than defaulted separately in four places — under a StatefulSet
            # this is the ordinal name, so a restarted pod reclaims its own queue.
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            # The namespace holding the leader Lease, taken from the pod rather than written out, so
            # it always matches the namespace kustomize deployed this StatefulSet into -- and
            # therefore the namespace whose Role above grants leases get/update/create. A literal
            # here would be a second copy of that name, free to drift; the downward API cannot.
            # Reading it needs no permissions: the kubelet resolves fieldRef from the pod spec
            # without going through the API server.
            #
            # All three replicas share this pod template, so they cannot disagree and cannot elect
            # two leaders. The one exception is a ROLLING update that CHANGES the value: old and new
            # pods would hold separate Leases at once. Scale to 0 and back if you ever move it.
            - name: Orchestrator__LeaseNamespace
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            # The collector already running in this namespace. Without it the SDK still works and
            # export simply fails quietly, so this is an enrichment rather than a dependency.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            # 10s, against a 15s Prometheus scrape. The collector emits explicit sample
            # timestamps and Prometheus discards a re-scrape bearing one it already stored,
            # so an export interval EQUAL to the scrape interval aliases and leaves some
            # scrapes with nothing new. Exporting faster than the scrape makes the effective
            # resolution the scrape interval.
            #
            # Load-bearing for the dashboards: Grafana derives $__rate_interval from the
            # datasource's timeInterval, which must track this value. At 60s it floored the
            # rate window at 240s, which is why a sixty-second outage moved no rate panel.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "10000"
            - name: RabbitMq__Host
              value: rabbitmq
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef: { name: skp-dev-secrets, key: RABBITMQ_DEFAULT_USER }
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef: { name: skp-dev-secrets, key: RABBITMQ_DEFAULT_PASS }
            - name: ConnectionStrings__Redis
              value: "redis:6379,abortConnect=false,connectTimeout=5000"
            - name: ConsoleHealth__Port
              value: "8081"
          ports:
            - name: health
              containerPort: 8081
          # Startup here means the hydration loop is running, and nothing more. HydrationService
          # flips the startup gate on the loop's first beat — ahead of the topology declare and
          # ahead of the first read of L2 — so this passes whether or not either dependency is
          # reachable. What it still catches is a process that cannot get as far as starting its
          # loop at all: a container that fails to build its host, or one wedged before the first
          # beat. Nothing a restart could not fix, which is what a startup probe should be scoped to.
          #
          # 30 x 5s is 150s, the same budget as processor-sample's startup probe, because it now
          # covers the same thing: process start and one loop iteration reaching its first beat. The
          # old 60 bought five minutes to cover retries against a slow Redis, and buying that here
          # was the defect — hydration against a store that is down can take longer than any finite
          # budget, and past it the kubelet killed the pod for a fault a fresh process meets
          # identically. That condition is /health/ready's now, where it may stay red for as long as
          # the outage lasts. Announcements are not lost meanwhile: the replica's queue is durable
          # and accumulates them until the consumer is admitted.
          startupProbe:
            httpGet: { path: /health/startup, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # Readiness is hydration: red until this replica has mirrored every workflow L2 lists into
          # L1 and admitted its consumer. No restart makes an unreachable store answer, which is
          # exactly why this is readiness and not startup or liveness — it may sit red for the whole
          # outage and go green again on its own. Safe to have at all only because
          # podManagementPolicy above is Parallel; under OrderedReady it would gate the creation of
          # the next replica. Read the two together.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          # Liveness answers from the checks tagged `live` — `self`, plus one per loop: the gate
          # probe's and hydration's. Not one of them touches a dependency, and that is the rule
          # rather than an accident: a Redis or broker outage must not restart these pods, because
          # both loops are built to retry through it and a restart only discards their backoff
          # progress. What this does catch is a loop that has stopped beating, which nothing inside
          # the process can repair.
          livenessProbe:
            httpGet: { path: /health/live, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests: { memory: "160Mi" }
            limits:   { memory: "384Mi" }
