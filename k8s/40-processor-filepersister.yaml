# processor-filepersister — the mirror of processor-filefetcher. That one turns an absolute path
# into an envelope of metadata and raw content; this one takes such an envelope and writes the file
# back to disk, then reports the absolute path it wrote. A downstream transform: it has an input and
# it produces output, so it is neither an importer nor an exporter. No Service — its only inbound
# traffic is the kubelet hitting the pod IP for probes.
#
# EXPECT IT TO SIT NOT-READY UNTIL A PROCESSOR ROW EXISTS, exactly as the other processors do.
# `kubectl rollout status` will time out; that timeout is the expected signal, not a fault.
#
# THE MOUNT IS WRITABLE, AND THAT IS THE ONE STRUCTURAL DIFFERENCE FROM FileFetcher's MANIFEST.
# Its mount carries readOnly: true because it only ever reads; this one must write, so it does not.
# The path differs too: /mnt/skp-files/out rather than .../in, because verification of a symmetric
# workflow is a comparison BETWEEN the two folders, and a processor writing back into the folder it
# read from would make that comparison meaningless.
#
# As with FileFetcher, the mount is the kind node's filesystem, not Windows — this cluster's node
# container was created with no extraMounts. Read what came out with:
#
#   kubectl exec -n skp <pod> -- ls -l /mnt/skp-files/out
#
# DirectoryOrCreate, so the folder exists before the pod starts. That matters more here than it does
# for the fetcher: FilePersisterConfig deliberately refuses to create a missing folder, because an
# absent folder means this mount is missing and creating it would write into the container's own
# layer — a file that reports a path and is gone at the next restart. The volume creating it on the
# HOST side is the correct place for that to happen.
#
# THE FILE IS WRITTEN IN TWO STAGES, and the mount is why. See FilePersister__TempExtension below:
# bytes land as <name>.skp and are renamed onto <name>, so nothing watching this folder can open a
# file that is still being written. A stray .skp left here is debris from a pod killed mid-write; the
# next dispatch for that name overwrites it, and nothing else reads it.
#
# THE MEMORY LIMIT IS 512Mi, MATCHING FileFetcher, AND FOR THE SAME REASON RUN BACKWARDS. The
# envelope arrives base64'd inside a ProcessedData message, is decoded to the raw bytes, and both
# coexist with a JsonDocument DOM at input validation — and the work and post consumers are the SAME
# process, so a dispatch and a branch overlap. There is no FilePersister__MaxFileSizeBytes to pair
# this with, deliberately: FileFetcher's ceiling already bounded these bytes on the way in, one whole
# workflow ago, and a second ceiling here would be a number that can disagree with the first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-filepersister
  namespace: skp
  labels:
    app: processor-filepersister
    app.kubernetes.io/part-of: skp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0, and this is sized memory, not caution for its own sake: this pod's limit is
      # 512Mi, higher than the other processors' 384Mi but half of ArchiveExpander's 768Mi, so a
      # surge briefly running two of them would want ~1Gi on the node at once — a single-node kind
      # cluster already running Postgres, Redis, RabbitMQ, Prometheus, Grafana, an OTel collector,
      # BaseApi, the orchestrator and the other processors. Stop-then-start trades a few seconds of
      # throughput for not needing that headroom.
      # (There is no correctness reason to forbid overlap here: two replicas would write different
      # files under different dispatches, and FilePersister consumes from its own RabbitMQ queue
      # as a competing consumer — this is purely a node-memory budget call.)
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: processor-filepersister
  template:
    metadata:
      labels:
        app: processor-filepersister
    spec:
      # THE ONE THING FileFetcher's MANIFEST DOES NOT NEED, AND THE REASON IS THE WRITE.
      # The runtime image runs as USER app (uid 1654), and a hostPath directory materialised by
      # DirectoryOrCreate is created by the kubelet as root:root 0755 — readable by anyone, writable
      # by nobody else. FileFetcher never noticed because it only ever reads. This one fails every
      # dispatch with "Access to the path ... is denied", which reads as a code fault and is not one.
      #
      # An initContainer rather than fsGroup: fsGroup does not apply to hostPath volumes, so it would
      # look like a fix and change nothing. runAsUser 0 on the MAIN container would work and is worse
      # — it would run every dispatch as root to solve a one-time ownership problem.
      #
      # Idempotent, so a restart costs one chown of an existing directory.
      initContainers:
        - name: own-the-mount
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown 1654:1654 /mnt/skp-files/out && chmod 0755 /mnt/skp-files/out"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: skp-files
              mountPath: /mnt/skp-files/out
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 32Mi }
      containers:
        - name: processor-filepersister
          image: processor-filepersister:local
          imagePullPolicy: IfNotPresent
          env:
            # NO Service__Name / Service__Version here, deliberately, and do not add them back.
            # A processor takes its service.name and service.version from its database row, resolved
            # before the host is built so they can reach the OTel resource, and that row wins over
            # configuration unconditionally. Setting them here changed nothing: telemetry reported
            # sample-proc-v9 / 1.5.0 whatever this said, so the pair read as live settings while
            # being inert -- an operator renaming a processor by editing this manifest would have
            # seen no effect and no error. The fallback they nominally provided now lives in code
            # (ProcessorHost, "processor" / "1.0.0"), which is where the other two services declare
            # theirs.
            # The replica identity that names this pod's liveness key, its reply queue, and the
            # service.instance.id on its telemetry. All three must be the same string, which is why it
            # is resolved once from the downward API rather than three times from three defaults.
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            # The collector already running in this namespace. Without it the SDK still works and
            # export simply fails quietly, so this is an enrichment rather than a dependency.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            # 10s, against a 15s Prometheus scrape. The collector emits explicit sample
            # timestamps and Prometheus discards a re-scrape bearing one it already stored,
            # so an export interval EQUAL to the scrape interval aliases and leaves some
            # scrapes with nothing new. Exporting faster than the scrape makes the effective
            # resolution the scrape interval.
            #
            # Load-bearing for the dashboards: Grafana derives $__rate_interval from the
            # datasource's timeInterval, which must track this value. At 60s it floored the
            # rate window at 240s, which is why a sixty-second outage moved no rate panel.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "10000"
            # THE STAGING SUFFIX, AND THE REASON THIS MOUNT NEEDS ONE.
            # A write into a hostPath volume is not instantaneous. A single-stage write truncates the
            # destination the moment it opens it, so for as long as the bytes are in flight this
            # folder holds a file that already has its final name and does not yet have its content —
            # and anything watching the folder can open it and read a truncated file with nothing
            # afterwards to say so. The processor therefore writes {fileName}.skp first and renames
            # it onto the final name, which within one directory is an atomic rename: a watcher sees
            # the final name either absent or complete.
            #
            # SET EXPLICITLY THOUGH IT MATCHES THE CODE DEFAULT, because the value has to agree with
            # whatever ignores it on the other side of this mount, and a number that has to agree
            # with something belongs where both halves can be read. Anything unusable — empty, a
            # separator — falls back to skp rather than failing the step: the suffix's only job is to
            # be a name a watcher skips, and one typo here must not stop every dispatch.
            - name: FilePersister__TempExtension
              value: "skp"
            - name: RabbitMq__Host
              value: rabbitmq
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef: { name: skp-dev-secrets, key: RABBITMQ_DEFAULT_USER }
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef: { name: skp-dev-secrets, key: RABBITMQ_DEFAULT_PASS }
            # Straight to Redis, the same address the orchestrator and the API use. This pointed at
            # a toxiproxy hop until 2026-09-01: the proxy was the only way to make a dependency slow
            # rather than absent on this cluster, but it put the processor on a Redis path production
            # does not have, so every latency measured here carried a hop production never pays.
            - name: ConnectionStrings__Redis
              value: "redis:6379,abortConnect=false,connectTimeout=5000"
            - name: ConsoleHealth__Port
              value: "8081"
          ports:
            - containerPort: 8081
          # Startup flips on the liveness loop's first beat, within moments of the host starting, so
          # this passes long before discovery does. It is deliberately not gated on identity: a
          # processor waiting on an unregistered row is starting correctly, however long that takes.
          startupProbe:
            httpGet: { path: /health/startup, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # Readiness is identity resolution. It stays red until the processor row exists, and no
          # restart will help — which is exactly why this is readiness and not liveness.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          # Liveness is the loops still turning, and nothing else. A broker that is down must not
          # restart this pod: the startup loop is designed to retry against it forever, and a restart
          # only throws away the backoff progress.
          livenessProbe:
            httpGet: { path: /health/live, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests: { memory: "256Mi" }
            limits:   { memory: "512Mi" }
          volumeMounts:
            - name: skp-files
              mountPath: /mnt/skp-files/out
      volumes:
        - name: skp-files
          # DirectoryOrCreate so a fresh node does not need the path seeded before the pod can
          # start. An empty directory is a correct state: every dispatch names its own file, and on
          # this side the directory starts empty by definition.
          hostPath:
            path: /mnt/skp-files/out
            type: DirectoryOrCreate
