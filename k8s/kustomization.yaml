apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Numbered by dependency order for a reader; kustomize does not sequence them and does not need to.
# Every component tolerates its dependencies being absent at start and converges once they appear,
# which is what makes the ordering advisory rather than load-bearing.
namespace: skp

resources:
  - 00-namespace.yaml
  - 01-secret.yaml
  - 02-configmaps.yaml
  - 10-postgres.yaml
  - 11-redis.yaml
  - 12-rabbitmq.yaml
  - 20-otel-collector.yaml
  - 21-prometheus.yaml
  - 23-grafana.yaml
  - 24-kibana.yaml
  # NOTE: 25-diagrams.yaml is NOT listed. Its ConfigMap is ~370 KB, which overflows the
  # last-applied-configuration annotation that a client-side apply writes (262144 byte limit).
  # Apply it on its own with --server-side:  kubectl apply --server-side -f k8s/25-diagrams.yaml
  - 30-baseapi-service.yaml
  - 33-processor-sample.yaml
  - 34-processor-kafkaimporter.yaml
  - 35-processor-kafkaexporter.yaml
  - 36-orchestrator.yaml
  - 37-processor-archiveexpander.yaml
  - 38-processor-filefetcher.yaml
  - 39-processor-archivecollapser.yaml
  - 40-processor-filepersister.yaml
  - 41-processor-sknormalizer.yaml
  - 42-processor-outcomerecorder.yaml
