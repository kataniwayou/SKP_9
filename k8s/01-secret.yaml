# ============================================================================
# DEV ONLY — mirrors the committed .env dev creds; NEVER a real cluster.
# ============================================================================
# These are the SAME public dev credentials already committed in .env and
# compose.yaml (postgres/postgres, guest/guest). Committing them here (D-07)
# adds no new exposure — scoped to the `skp` namespace on local Docker Desktop
# only. Uses `stringData` (NOT `data`) so values stay readable/diff-able
# against .env; Kubernetes base64-encodes them on write.
apiVersion: v1
kind: Secret
metadata:
  name: skp-dev-secrets
  namespace: skp
  labels:
    app.kubernetes.io/part-of: skp
    sensitivity: dev-only
type: Opaque
stringData:
  POSTGRES_DB: stepsdb
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASS: guest
