# Toxiproxy — the latency lever, sitting permanently between the processor and Redis.
#
# WHY A PROXY AND NOT tc netem. Not a preference. The WSL2 kernel this cluster runs on
# (5.15.146.1-microsoft-standard-WSL2) reports `CONFIG_NET_SCH_NETEM is not set` and carries no
# loadable modules at all — /lib/modules does not exist — so `tc qdisc add ... netem` fails with
# `Specified qdisc kind is unknown` even under --privileged. BusyBox's `tc` applet is present but
# is a stub that rejects `root`. Kernel-level latency injection is unavailable here, full stop, and
# a userspace proxy is the only remaining way to make a dependency slow rather than absent.
#
# WHY IT IS ALWAYS IN THE PATH. A proxy inserted only for chaos runs would change the topology
# between the baseline and the fault, leaving two variables moving instead of one. Permanent
# insertion costs one extra hop on every Redis call the processor makes; that cost is measured by
# re-running the existing Redis scenarios rather than assumed to be nil.
#
# ONLY THE PROCESSOR IS REPOINTED. The orchestrator and the API still talk to Redis directly, which
# makes a fault run an attribution test as well as a latency test: one workload's dependency is slow
# while its peers' is not, so a board that blames the wrong service will say so.
#
# THE IMAGE IS LOCAL TO THE NODE AND EXISTS IN NO REGISTRY, so imagePullPolicy MUST stay
# IfNotPresent. `kind load` cannot install it — both `kind load docker-image` and
# `kind load image-archive` fail with `ctr: content digest ... not found`, because the published
# manifest is a multi-platform list carrying attestations that containerd's importer will not
# resolve. What works:
#
#     docker pull --platform linux/amd64 ghcr.io/shopify/toxiproxy:2.12.0
#     docker tag ghcr.io/shopify/toxiproxy:2.12.0 skp-toxiproxy:2.12.0
#     docker save skp-toxiproxy:2.12.0 -o tp.tar
#     docker exec -i desktop-control-plane ctr -n k8s.io images import - < tp.tar
#
# TOXICS DO NOT SELF-EXPIRE. This is the one property that makes this lever worse than CLIENT PAUSE:
# a killed run leaves the latency in place indefinitely. Every lever in ClusterControl that adds a
# toxic must remove it on disposal AND clear a stale one of the same name on entry, so a previously
# killed run cannot poison the next.
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  namespace: skp
  labels:
    app: toxiproxy
    app.kubernetes.io/part-of: skp
spec:
  type: ClusterIP
  selector:
    app: toxiproxy
  ports:
    # The name matters only to a reader; the processor connects here believing it is Redis.
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
    - name: api
      port: 8474
      targetPort: 8474
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: toxiproxy-config
  namespace: skp
  labels:
    app.kubernetes.io/part-of: skp
data:
  # Declared here rather than created at runtime through the API, so the proxy exists the moment the
  # pod is ready. A runtime create would leave a window in which the processor's Redis connection
  # string points at a listener that is not there yet, and the processor would spend its startup
  # retrying against a refused port for no reason anyone would enjoy diagnosing.
  toxiproxy.json: |
    [
      {
        "name": "redis",
        "listen": "0.0.0.0:6379",
        "upstream": "redis:6379",
        "enabled": true
      }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  namespace: skp
  labels:
    app: toxiproxy
    app.kubernetes.io/part-of: skp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toxiproxy
  template:
    metadata:
      labels:
        app: toxiproxy
        app.kubernetes.io/part-of: skp
    spec:
      containers:
        - name: toxiproxy
          image: skp-toxiproxy:2.12.0
          imagePullPolicy: IfNotPresent
          args:
            - "-host=0.0.0.0"
            - "-config=/config/toxiproxy.json"
          ports:
            - name: redis
              containerPort: 6379
            - name: api
              containerPort: 8474
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          # The image is distroless — no shell, no wget, no curl — so an exec probe is not available
          # and an httpGet against the API port is the only readiness signal on offer. /version is
          # the cheapest endpoint the API serves and needs no proxy to exist to answer.
          readinessProbe:
            httpGet: { path: /version, port: 8474 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
            limits:
              memory: "128Mi"
      volumes:
        - name: config
          configMap:
            name: toxiproxy-config
