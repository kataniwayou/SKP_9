# Two ConfigMaps replacing compose's bind-mounted config files (D-06).
# Bodies carried BYTE-FOR-BYTE from compose/otel-collector-config.yaml and
# prometheus.yml — do NOT edit scrape targets, exporters, or mapping.mode.
#
# NOTE for kustomization plan (80-07): these hand-authored ConfigMaps are the
# canonical drop-in. If 80-07 uses a kustomize configMapGenerator it MUST set
# disableNameSuffixHash: true AND reuse these SAME names (otel-collector-config,
# prometheus-config) so the Deployment volume refs (80-04) do not break — this
# file would then be dropped from the resource list.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: skp
  labels:
    app.kubernetes.io/part-of: skp
data:
  # Mounted (subPath) at /etc/otel-collector-config.yaml — compose.yaml L63.
  otel-collector-config.yaml: |
    # OTel Collector Contrib config — Phase 11 shape (was Phase 5 D-10 + Plan 05-02 fix-forward).
    #
    # Pipelines: logs → elasticsearch exporter (single-sink per Phase 11 D-01);
    #            metrics → filter/health_metrics processor → prometheus exporter
    #            (single-sink per Phase 11 D-02; D-04 preserves the Phase 5 fix-forward
    #            that drops /health/* data points before egress);
    #            traces → REMOVED (Phase 11 D-03 — no traces backend in v1).
    #
    # Receivers accept OTLP gRPC (4317) + HTTP (4318) — unchanged from Phase 5.
    # health_check extension on :13133 — host-side `curl localhost:13133/` smoke probe
    # (Phase 5 D-10 + RESEARCH Open Q4 carry-forward; distroless image has no in-container
    # probe per Plan 05-01 deviation #1 + RESEARCH Pitfall 3).
    #
    # Backends (compose-internal DNS):
    #   - http://elasticsearch:9200 (sk-elasticsearch container, D-12 dev posture)
    #   - http://prometheus:9090 (scrape source: this collector exposes /metrics on :8889)
    
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      # Plan 05-02 fix-forward to Plan 05-01 (closes SC#4 metrics-half gap); Phase 11 D-04 re-points this processor at the Prometheus exporter pipeline (was [file, logging]).
      #
      # CONTEXT: OpenTelemetry.Instrumentation.AspNetCore 1.15.0's
      # MeterProviderBuilder.AddAspNetCoreInstrumentation is PARAMETERLESS — no Filter
      # callback exists on the metrics side (only on the TracerProviderBuilder overload).
      # In .NET 8 the AspNetCore HTTP server metrics come from the built-in
      # `Microsoft.AspNetCore.Hosting` Meter whose `http.server.request.duration`
      # instrument has no per-tag drop knob; `.DisableHttpMetrics()` is .NET 9+ only.
      #
      # SOLUTION (Collector-side filtering): the otel-collector-contrib filterprocessor
      # drops data points whose `metric.name == "http.server.request.duration"` AND whose
      # `attributes["http.route"]` starts with `/health/`. SDK still emits, Collector
      # drops data points whose http.route starts with /health/ before the Prometheus exporter — tests observe ZERO health-route samples in Prom queries (Phase 11 D-04).
      #
      # This is the idiomatic OTel architecture: SDK emits all, Collector applies
      # ops-policy filtering. Backend filtering (Grafana/Tempo/Datadog) becomes a
      # secondary layer atop this. Plan 05-01 OBSERV-08 / HEALTH-05 are now FULLY
      # satisfied for metrics (previously partial — backend-only).
      filter/health_metrics:
        error_mode: ignore
        metrics:
          datapoint:
            # Drop http.server.request.duration data points whose http.route is a health probe
            - 'metric.name == "http.server.request.duration" and IsMatch(attributes["http.route"], "^/health/.*")'
    
    exporters:
      # Phase 11 D-07 — exposes /metrics on :8889 for the sk-prometheus container to scrape.
      # OTel → Prometheus naming (load-bearing for test assertions):
      #   dot-form `http.server.request.duration` → underscore-form `http_server_request_duration`;
      #   Histogram (unit="s") expands to `_count` + `_sum` + `_bucket` triplet with `_seconds` suffix
      #   → final Prom name `http_server_request_duration_seconds_count` (and _sum / _bucket).
      #   monotonic Sum gains `_total` suffix (e.g., `db.client.operations` → `db_client_operations_total`).
      # (RESEARCH Pitfall 1 — the only complete reference for this mapping is the OTel spec at
      #  https://opentelemetry.io/docs/specs/otel/compatibility/prometheus_and_openmetrics/.)
      prometheus:
        endpoint: 0.0.0.0:8889
        # CRITICAL per RESEARCH Pitfall 1: without resource_to_telemetry_conversion: true,
        # resource attributes (service.name, service.version) do NOT become Prometheus labels.
        # Phase 11 D-17 round-trip tests assert {service_name="sk-api"} — non-negotiable.
        resource_to_telemetry_conversion:
          enabled: true
        # Emit sample timestamps from the OTLP source rather than scrape time. Reduces
        # Prometheus's apparent metric latency by ~15s — improves E2E test determinism.
        send_timestamps: true
    
      # Phase 11 D-06 — native elasticsearch exporter (otel-collector-contrib).
      # mapping.mode: none preserves OTLP raw field structure (Body, SeverityText,
      # Attributes.<key>, Resource.<key> — capital first letter) and produces the
      # data stream `logs-generic-default` (backing index `.ds-logs-generic-default-NNNN`).
      # NOTE (RESEARCH Open Q1): sk2_1's live ES on this host shows the OTel-mode index
      # `logs-generic.otel-default` despite an identical `mapping.mode: none` YAML. Wave 0
      # verification in Plan 11-07 confirms the actual index name on first sk_p compose-up
      # by running `curl /_cat/indices`; the test helper constant is baked from that probe.
      elasticsearch:
        endpoints:
          # Compose-internal hostname — resolves to sk-elasticsearch container via default
          # compose network (Pattern 5: collector inside compose, tests outside via host-DNS).
          - http://elasticsearch:9200
        mapping:
          mode: none
        # No auth/tls blocks — dev posture per Phase 11 D-12 + sk2_1 lock-in.
    
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    
    service:
      extensions: [health_check]
      pipelines:
        logs:
          # Phase 11 D-01 — single sink. No file fan-out. No debug exporter.
          receivers: [otlp]
          exporters: [elasticsearch]
        metrics:
          # Phase 11 D-02 — single sink to Prometheus exporter.
          # Phase 11 D-04 — filter/health_metrics processor re-pointed at this pipeline
          # (was metrics→file in Phase 5; now metrics→prometheus). OBSERV-08 invariant
          # preserved: /health/* data points dropped before reaching the Prom exporter.
          receivers: [otlp]
          processors: [filter/health_metrics]
          exporters: [prometheus]
        # Phase 11 D-03 — traces pipeline REMOVED. No traces backend in v1. OBSERV-12
        # superseded to Out of Scope (REQUIREMENTS.md Phase 11 amendment). The collector
        # will still ACCEPT trace OTLP records on the OTLP receiver but will silently
        # drop them since no pipeline consumes them — this is intentional and matches
        # sk2_1's lock-in posture.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: skp
  labels:
    app.kubernetes.io/part-of: skp
data:
  # Mounted (subPath) at /etc/prometheus/prometheus.yml — compose.yaml L96.
  prometheus.yml: |
    # Phase 11 D-08 — Prometheus scrape config for the otel-collector's prometheus exporter.
    # Single static target — the collector exposes /metrics on :8889 (see compose/otel-collector-config.yaml
    # exporters.prometheus.endpoint per Phase 11 D-07). 15s scrape interval matches sk2_1 lock-in.
    #
    # Layout: this file lives at the sk_p repo root (matches sk2_1's flat layout per D-08); the
    # `prometheus` service in compose.yaml bind-mounts it read-only at /etc/prometheus/prometheus.yml.
    
    global:
      scrape_interval: 15s        # D-07 / D-08: matches default; explicit for clarity
      evaluation_interval: 15s    # Rule eval cadence (no rules defined — kept for default sanity)
      scrape_timeout: 10s         # Prometheus default; explicit for clarity. Must be < scrape_interval per Prometheus validation.

    rule_files:
      - /etc/prometheus/skp-rules.yml

    scrape_configs:
      - job_name: 'otel-collector'
        # NO authentication — dev mode (parallels compose.yaml D-12/D-13 no-auth posture).
        # NO tls_config — dev mode (production hardening lives in a downstream service repo).
        static_configs:
          - targets:
              # Compose-internal hostname; resolves to sk-otel-collector container via the
              # default compose network. RESEARCH Pattern 5 — Prom container is INSIDE compose
              # so it uses service-DNS, not host-DNS. Test code outside compose uses
              # http://localhost:9090 (Prom HTTP API) instead.
              - 'otel-collector:8889'
        # Path defaults to /metrics — explicit for documentation clarity.
        metrics_path: '/metrics'
        # No metric_relabel_configs — we want raw OTel → Prometheus name translation.
        # The resource_to_telemetry_conversion: true setting lives on the collector's
        # prometheus exporter (Phase 11 D-07; compose/otel-collector-config.yaml). That is
        # what makes `service.name` become the `service_name` Prom label — non-negotiable
        # for Phase 11 D-17 round-trip test assertions.
        #
        # DELIBERATELY NO LABEL SURGERY HERE. In production, Prometheus is ORG-OWNED — we do
        # not control its scrape config, so honor_labels / metric_relabel_configs are NOT
        # available levers and must never be load-bearing for our label shape. Anything we
        # need dropped or renamed has to be handled upstream, in the collector or the SDK
        # resource. Keeping this file free of relabel rules keeps the local dev Prometheus an
        # honest stand-in for the org one.
  skp-rules.yml: |
    # Every rule here fires on a signal the chaos suite has actually moved, with both its
    # healthy and its fault value measured. Nothing is asserted about a signal that has
    # never been observed to change -- `landed="false"` has never occurred on this stack,
    # so there is deliberately no ack-loss rule.
    #
    # THIS FILE IS MOUNTED subPath (k8s/21-prometheus.yaml, second volumeMount). A subPath
    # mount does NOT live-update when the ConfigMap changes: `kubectl apply` alone changes
    # nothing inside the running container. A rules edit needs
    # `kubectl rollout restart deploy/prometheus` to take effect.
    #
    # VALIDATE BEFORE APPLYING. A malformed rules file stops Prometheus from starting and
    # takes every dashboard with it. `promtool` and `tar` both exist in the prom image:
    #     kubectl cp skp-rules.yml skp/<prom-pod>:/tmp/skp-rules.yml
    #     kubectl exec -n skp <prom-pod> -- promtool check rules /tmp/skp-rules.yml
    #
    # WHY EVERY GAUGE AGGREGATE ENDS `or vector(0)`. An aggregation over a selector that
    # matches nothing yields an EMPTY vector, the comparison never evaluates, and the rule
    # is silent. That silences the whole rule set during a whole-stack outage -- the one
    # failure mode where these rules matter most. The generator's stats all carry the
    # fallback (`LIVE_WORKERS`, every `min(live(...))` in grafana/build-dashboards.py); the
    # first copies of these rules dropped it. EgressFaults is the deliberate exception:
    # it counts faults, so an empty input genuinely means "no faults have happened", and a
    # labelless `vector(0)` fallback would strip the service_name/outcome its annotation
    # prints -- the same reason `counted()`'s by-label callers cannot carry one.
    #
    # The liveness windows must track LIVENESS in grafana/build-dashboards.py. They are the
    # same decision expressed twice because Prometheus cannot read the generator. That
    # coupling is now enforced rather than remembered: grafana/check-expressions.py's
    # check_liveness_windows() fails if any liveness window in this file disagrees with
    # LIVENESS. If you change one, change both and re-run that script.
    groups:
      - name: skp-pipeline
        interval: 15s
        rules:
          - alert: TelemetryStale
            # First, because every other rule is downstream of it. Healthy sawtooths 0-15s
            # at the 10s export cadence against a 15s scrape.
            #
            # WHAT IT WATCHES, AND WHAT IT DOES NOT. The selector is
            # `pipeline_gate_open_ratio`, which only the orchestrator and the processors
            # export. baseapi does not export it at all, so baseapi going dark is invisible
            # here -- the summary says "worker" rather than "service" for that reason.
            #
            # THE present_over_time MASK IS LOAD-BEARING. `service_name` on a processor is
            # version-stamped from the database row (`sample-proc-v9`), so a redeploy
            # RETIRES a name rather than restarting it. Prometheus's 5-minute lookback then
            # keeps serving the dead name's last sample, and `timestamp()` on it returns
            # that sample's own (receding) timestamp -- so the min stayed pinned to a name
            # that no longer exists and the rule fired for minutes on a routine redeploy.
            # `and present_over_time(...[2m])` keeps only series with a REAL sample in the
            # last two minutes, which drops a retired name in 2m instead of 5m.
            #
            # `last_over_time(...[2m])` does NOT work here, and was measured not to before
            # this rule was written: the `*_over_time` family stamps its output with the
            # EVALUATION time, so `timestamp(last_over_time(x[2m]))` reads 0s staleness for
            # every series, healthy or dead. Measured live: raw `timestamp()` gave 23.2s and
            # 13.6s for the two live service_names at the same instant the wrapped form gave
            # 0 and 0.
            #
            # Threshold 45, not a fourth invented number: it is T_STALE's orange step in
            # grafana/build-dashboards.py, so this alert and the Data freshness panel change
            # colour at the same instant. With `for: 30s` that is 75s of staleness to fire,
            # down from 120s (60s threshold + 60s `for`), which is why the rule recorded
            # zero firing seconds across a full chaos run.
            #
            # THE RESIDUAL, STATED RATHER THAN CLAIMED AWAY: a retired name is still stale
            # for the ~45s between crossing the threshold and falling out of the 2m window,
            # so a redeploy can still raise this for up to ~45s. That is down from ~3m
            # before, not zero. Telling "retired" from "stalled" needs an expected-replica
            # count this stack does not publish. Two minutes is the FLOOR for the window:
            # anything shorter and the series drops out before 75s of staleness has
            # elapsed, and the rule could never fire on a genuine stall at all.
            expr: >-
              time() - (min(max by (service_name) (
              timestamp(pipeline_gate_open_ratio)
              and present_over_time(pipeline_gate_open_ratio[2m])
              )) or vector(0)) > 45
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "A pipeline worker has stopped exporting metrics"
              description: "Least-fresh orchestrator/processor replica last exported {{ $value | humanizeDuration }} ago. A value in the decades means NOTHING matched the selector at all -- the vector(0) fallback subtracting from the Unix epoch -- which is a whole-stack telemetry outage, not a clock fault. baseapi is not watched by this rule; it does not export the selector. Every other alert is unreliable while this is firing."

          - alert: PipelineNotConsuming
            # Measured 1 throughout the undisturbed baseline; 0 within ~40s of a Redis
            # pause, a broker outage, both at once, and an L2 wipe.
            #
            # The `or vector(0)` makes a total absence of consumers read as 0 rather than
            # as silence. That also means a cold stack with nothing running yet fires this,
            # which is correct: no replica is consuming.
            expr: (min(last_over_time(pipeline_consumer_consuming_ratio[40s])) or vector(0)) == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "A queue has no consumer"
              description: "At least one queue on a live replica is not consuming. Check L2GateShut to tell a store fault from a broker fault."

          - alert: L2GateShut
            # The discriminator: 0 for a Redis fault, 1 for a broker fault. Both close
            # PipelineNotConsuming, so this is what separates the two call-outs.
            expr: (min(last_over_time(pipeline_gate_open_ratio[40s])) or vector(0)) == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "The L2 gate is shut"
              description: "Deliveries are being requeued because the projection store is unusable. If PipelineNotConsuming is firing and this is not, the fault is the broker, not the store."

          - alert: WorkersMissing
            # A DROP DETECTOR, and the annotation now says so. Fewer replicas reporting now
            # than five minutes ago. NOT peak-minus-trough over a window: that also fires on
            # a monotonic increase -- a Deployment surging up during a redeploy -- and stays
            # true for a full window after the replicas are back. The dashboard stat of the
            # same name DOES use peak-minus-trough, deliberately: a panel should tell a late
            # arrival what happened, an alert should describe what is true now.
            #
            # `for: 30s` -- two evaluation intervals at this group's 15s interval, and the
            # correction for the defect that made this rule dead on arrival. It shipped at
            # `for: 2m`, needing 120s of sustained drop. The live dips this rule exists to
            # catch measure 30-60s wide, so across a full eight-scenario chaos run -- three
            # of whose scenarios remove replicas -- it reached `pending` for 150s total and
            # `firing` for ZERO seconds. It had never once fired.
            #
            # THE HONEST TRADE AT THIS RESOLUTION: 30s is exactly two samples, so a 30s-wide
            # dip sits on the boundary and may reach only `pending` and never `firing`. This
            # rule reliably catches a dip of roughly 45s or more; a 30s dip is a coin flip,
            # and anything shorter than one export is not observable at all. Do NOT read a
            # silent WorkersMissing as "no replica was lost" -- read the Workers missing (5m)
            # stat on SKP Flow, which is shaped to catch the transient this cannot.
            #
            # WHY IT SELF-CLEARS. The reference is a SLIDING `offset 5m`, so once the loss is
            # older than about 5m40s (the offset plus the liveness window) the reference
            # window sits inside the outage too, both sides count the reduced set, and this
            # clears WHILE THE REPLICAS ARE STILL GONE. The expression measures a change, not
            # an absence, and cannot express "and have not come back" -- the annotation used
            # to claim exactly that and was wrong. Fixing the maths instead would mean
            # comparing against a window maximum, which is the redeploy cry-wolf this rule
            # was rewritten to remove. The words were the thing to change.
            #
            # The 40s liveness windows track LIVENESS in grafana/build-dashboards.py.
            # Measured: 0 firing across the undisturbed baseline; a lost orchestrator
            # StatefulSet drops the count by 3, a lost processor pair by 2.
            expr: >-
              (count(count by (service_instance_id) (present_over_time(pipeline_gate_open_ratio[40s]))) or vector(0))
              <
              (count(count by (service_instance_id) (present_over_time(pipeline_gate_open_ratio[40s] offset 5m))) or vector(0))
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "Worker replica count has dropped in the last five minutes"
              description: "Fewer replicas are reporting now than five minutes ago. This detects the DROP, not the absence: the reference slides, so once the loss is older than about 5m40s this clears on its own even if the replicas never came back -- read Workers reporting on SKP Flow for the standing count. Detection lags the event by roughly the liveness window plus one export (~52-66s measured), and a dip much narrower than 45s may reach pending without ever firing. A deliberate rolling restart will also trip this."

          - alert: EgressFaults
            # unroutable = the queue is not declared; transient = the broker is unreachable.
            # Opposite remedies, which is why the reason label travels in the annotation.
            #
            # THE LARGER OF IN-WINDOW GROWTH AND ABSOLUTE TOTAL -- `counted()`'s shape in
            # grafana/build-dashboards.py, not bare `increase()`. These counters have no
            # series at all in health: the .NET counter is created on first increment, so
            # the first burst of a given fault type appears as a series whose very first
            # exported sample is ALREADY non-zero, and `increase()` measures growth WITHIN
            # the window and therefore reports 0 for precisely that case. This rule shipped
            # as bare `increase(...[5m]) > 0` and fired in the last chaos run only because
            # earlier scenarios had already created the series; on a fresh cluster the first
            # egress fault would have been invisible to it while the Egress faults stat
            # beside it read 2. Confirmed against this cluster after a redeploy: NO
            # transient / unroutable / refused series exists at all right now.
            #
            # Outer parentheses are load-bearing. `>` binds tighter than `or` in PromQL, so
            # `(A > B) or B > 0` parses as `(A > B) or (B > 0)` -- a different query. The
            # comparison has to wrap the whole `or`.
            #
            # Consequence worth knowing, same as the panel: once a fault series exists it is
            # exported for the life of the process, so this stays firing until the replica
            # restarts. Severity is warning for that reason -- it means "this happened",
            # not "this is happening".
            expr: >-
              (((sum by (service_name,outcome) (increase(pipeline_messages_produced_total{outcome=~"transient|unroutable|refused"}[5m])))
              > (sum by (service_name,outcome) (max_over_time(pipeline_messages_produced_total{outcome=~"transient|unroutable|refused"}[5m]))))
              or (sum by (service_name,outcome) (max_over_time(pipeline_messages_produced_total{outcome=~"transient|unroutable|refused"}[5m])))) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service_name }} failed to publish ({{ $labels.outcome }})"
              description: "{{ $value | printf \"%.0f\" }} send(s) did not reach the broker -- the larger of the last five minutes' growth and the process's running total, so a fault whose series was born inside the window still counts. transient = broker unreachable; unroutable = queue not declared; refused = the broker answered and declined the publish."
