# ============================================================================
# redis — L2 cache (StatefulSet, NO PVC, ephemeral by design + headless Service).
# ============================================================================
# Port of the compose `redis` block (compose.yaml L135-151). A StatefulSet grants
# stable identity (`redis-0`) + stable DNS via the same-named headless Service.
# Persistence is OFF by design (D-12): the `--save "" --appendonly no` command args
# are carried BYTE-FOR-BYTE from compose and there is deliberately NO PVC — L2 is
# rebuildable from L3 on demand, so RDB/AOF are dead weight. Do NOT re-enable
# persistence. The compose `6380:6379` host publish is dropped; it re-emerges only
# at port-forward (D-14).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: skp
  labels:
    app: redis
    app.kubernetes.io/part-of: skp
spec:
  clusterIP: None            # headless — required for StatefulSet stable DNS
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: skp
  labels:
    app: redis
    app.kubernetes.io/part-of: skp
spec:
  serviceName: redis         # MUST match the headless Service name
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.9-alpine       # verbatim (public image)
          command: ["redis-server", "--save", "", "--appendonly", "no"]   # D-12 — carried BYTE-FOR-BYTE (ephemeral by design)
          ports:
            - containerPort: 6379
          # compose healthcheck 5s/3s/10/5s → readiness exec
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "192Mi"
      # NO volumeClaimTemplates, NO volumeMounts — redis is ephemeral (D-12)
