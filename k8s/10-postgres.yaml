# ============================================================================
# postgres — L3 relational store (StatefulSet + 1Gi PVC + headless Service).
# ============================================================================
# Port of the compose `postgres` block (compose.yaml L6-22). A StatefulSet
# grants stable identity (`postgres-0`) + stable DNS via the same-named headless
# Service; `volumeClaimTemplates` provisions the per-pod PVC (D-09) mirroring the
# compose `pgdata` named volume. Creds come from `skp-dev-secrets` via
# `secretKeyRef` (D-07) — never baked into the image (threat T-80-04). The compose
# `5433:5432` host publish is dropped; it re-emerges only at port-forward (D-14).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: skp
  labels:
    app: postgres
    app.kubernetes.io/part-of: skp
spec:
  clusterIP: None            # headless — required for StatefulSet stable DNS
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: skp
  labels:
    app: postgres
    app.kubernetes.io/part-of: skp
spec:
  serviceName: postgres      # MUST match the headless Service name
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine       # verbatim (public image — no imagePullPolicy override)
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: skp-dev-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: skp-dev-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skp-dev-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              # postgres:18+ Docker images store data in a major-version subdir
              # (/var/lib/postgresql/18/docker) and require the volume mounted at
              # /var/lib/postgresql — NOT the pre-18 /var/lib/postgresql/data
              # (docker-library/postgres#1259). Mounting the old path makes PG 18
              # refuse to start ("PostgreSQL data in ... (unused mount/volume)").
              mountPath: /var/lib/postgresql
          # compose healthcheck 5s/5s/10/5s → readiness exec (creds resolve to postgres/stepsdb via .env)
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "stepsdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        # storageClassName omitted → Docker Desktop default "hostpath" provisioner binds
